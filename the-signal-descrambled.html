<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Signal Descrambled — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf?v=3') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf?v=3') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --void: #F8F2E4;
      --gold: #B8861C;
      --gold-bright: #D4A830;
      --gold-dim: #7A5C14;
      --gold-muted: #9A7020;
      --bone: #0A0A0A;
      --ash: #3A3020;
      --border: #D4AF6A;
      --btn-bg: #EDE5CE;
    }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--void);
      color: var(--bone);
      font-family: 'PLHand', cursive;
      overflow-x: hidden;
      user-select: none;
    }

    #p5-host {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #p5-host canvas { display: block; width: 100% !important; height: 100% !important; }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 48px;
    }

    .nav-bar {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
    }
    .nav-link {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--ash);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--gold); }

    #hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 32px;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .hud-item { color: var(--gold-dim); }
    .hud-item strong { color: var(--gold); font-weight: 300; }

    #timer-bar-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      z-index: 20;
    }
    #timer-bar {
      height: 100%;
      background: var(--gold);
      width: 100%;
      transition: width 0.1s linear, background 0.5s;
    }

    #status-msg {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ash);
      text-align: center;
      margin-bottom: 32px;
      height: 16px;
    }

    #phrase-display {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(14px, 2.2vw, 20px);
      color: var(--gold-muted);
      text-align: center;
      letter-spacing: 0.05em;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 600px;
      min-height: 60px;
    }

    #scramble-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
      margin-bottom: 32px;
    }

    .word-chip {
      padding: 8px 14px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--bone);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .word-chip:hover { border-color: var(--gold-dim); }
    .word-chip.selected {
      background: rgba(201, 168, 76, 0.18);
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .word-chip.used {
      opacity: 0.2;
      pointer-events: none;
      cursor: default;
    }

    #answer-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 640px;
      min-height: 48px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .answer-chip {
      padding: 8px 14px;
      background: rgba(201, 168, 76, 0.08);
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold);
      cursor: pointer;
      transition: background 0.15s;
    }
    .answer-chip:hover { background: rgba(201, 168, 76, 0.15); }

    .correct-flash { animation: flash-correct 0.4s ease; }
    @keyframes flash-correct {
      0%,100% { border-color: var(--gold-dim); }
      50% { border-color: var(--gold-bright); background: rgba(240,216,120,0.25); }
    }

    #action-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 24px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--bone);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn:hover { border-color: var(--gold-dim); color: var(--gold); }
    .btn.primary {
      border-color: var(--gold-dim);
      color: var(--gold);
    }
    .btn.primary:hover { border-color: var(--gold); }

    #plhand-reveal {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'PLHand', cursive;
      font-size: clamp(18px, 3.5vw, 26px);
      color: var(--gold);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(8,8,8,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }
    #overlay-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(24px, 5vw, 40px);
      color: var(--gold);
      letter-spacing: 0.05em;
      text-align: center;
    }
    #overlay-score {
      font-size: 11px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--ash);
    }
    #overlay-hand {
      font-family: 'PLHand', cursive;
      font-size: clamp(20px, 4vw, 30px);
      color: var(--gold);
      letter-spacing: 0.05em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
      #p5-host { display: none; }
    }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>

<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#B8861C;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Signal Descrambled</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">The message was always there beneath the noise. Descramble it. What you uncover has been waiting.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#B8861C;color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>

  <div id="p5-host"></div>

  <div id="timer-bar-wrap"><div id="timer-bar"></div></div>

  <nav class="nav-bar">
    <a class="nav-link" href="index.html">← Games</a>
  </nav>

  <div id="hud">
    <span class="hud-item">Round: <strong id="roundNum">1</strong> / 5</span>
    <span class="hud-item">Correct: <strong id="correctCount">0</strong></span>
    <span class="hud-item">Time: <strong id="timerNum">60</strong>s</span>
  </div>

  <div class="page">
    <div id="status-msg">Descramble the signal.</div>
    <div id="phrase-display"></div>
    <div id="answer-area"></div>
    <div id="scramble-area"></div>
    <div id="action-row">
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn primary" id="checkBtn">Check</button>
    </div>
  </div>

  <div id="plhand-reveal">The signal is clear.</div>

  <div id="overlay">
    <div id="overlay-title">The Signal Is Yours</div>
    <div id="overlay-score"></div>
    <div id="overlay-hand">Watch this.</div>
    <button class="btn primary" id="restartBtn" style="margin-top:16px">Begin Again</button>
  </div>

<script>
  /* ── Vault seed phrases ──────────────────────────────────── */
  const VAULT_PHRASES = [
    "Luxury is simply permission to expand",
    "Prepared for the version of you that already arrived",
    "Reality bends for the prepared",
    "What persists in the mind becomes your reality",
    "You are in control of your reality",
    "Precision creates miracles",
    "Attraction is a side effect of alignment",
    "Become the person your dreams report to",
    "Act like the universe already said yes",
    "Growth is the most luxurious act",
    "Think in gold act in inevitability",
    "Manifestation is just luxury with instructions",
    "Collapse the timeline where you are waiting",
    "Replace the default settings with your own",
    "Command your timeline like it is already yours",
    "Energy matches taste reality upgrades",
    "Broadcast the frequency that money recognizes",
    "The universe delivers to those who are ready",
    "You are not chasing wealth you are remembering it",
    "Let your energy announce your arrival",
  ];

  const FALLBACK_CORPUS = [
    "Luxury is simply permission to expand",
    "Prepared for the version of you that already arrived",
    "Reality bends for the prepared",
    "What persists in the mind becomes your reality",
    "You are in control of your reality",
    "Precision creates miracles",
    "Attraction is a side effect of alignment",
    "Become the person your dreams report to",
    "Act like the universe already said yes",
    "Growth is the most luxurious act",
  ];

  /* ── State ───────────────────────────────────────────────── */
  const TOTAL_ROUNDS = 5;
  const TIME_LIMIT   = 60;

  let phrases       = [];
  let round         = 0;
  let correctCount  = 0;
  let currentWords  = [];
  let scrambled     = [];
  let answer        = [];
  let timerInt      = null;
  let timeLeft      = TIME_LIMIT;
  let roundActive   = false;
  let ghostWords    = [];

  /* ── DOM ─────────────────────────────────────────────────── */
  const elStatus     = document.getElementById('status-msg');
  const elPhrase     = document.getElementById('phrase-display');
  const elScramble   = document.getElementById('scramble-area');
  const elAnswer     = document.getElementById('answer-area');
  const elRound      = document.getElementById('roundNum');
  const elCorrect    = document.getElementById('correctCount');
  const elTimer      = document.getElementById('timerNum');
  const elTimerBar   = document.getElementById('timer-bar');
  const elReveal     = document.getElementById('plhand-reveal');
  const elOverlay    = document.getElementById('overlay');
  const elOverScore  = document.getElementById('overlay-score');
  const clearBtn     = document.getElementById('clearBtn');
  const checkBtn     = document.getElementById('checkBtn');
  const restartBtn   = document.getElementById('restartBtn');

  /* ── Fetch phrases ───────────────────────────────────────── */
  async function loadPhrases() {
    const pool = [...VAULT_PHRASES];
    // REAL founder phrases first (PLGames spine, S142 — the /api/search source below
    // returns ok-but-empty, so this game has been running on its canned pool alone).
    if (window.PLGames && PLGames.seeds) {
      try {
        const sds = await PLGames.seeds(10);
        sds.forEach(sd => {
          const sentence = (sd.phrase || '').split('—').pop().trim().replace(/[“”‘’"]/g, '');
          if (sentence) pool.push(sentence);
        });
      } catch (_) {}
    }
    try {
      const r = await fetch(
        'https://pl-cron.psychedluxuries.com/api/search?q=reality+mind+practice&lens=doctrine&limit=10',
        { signal: AbortSignal.timeout(5000) }
      );
      if (r.ok) {
        const d = await r.json();
        if (d.results && d.results.length > 0) {
          d.results.forEach(x => {
            if (x.quote && x.quote.length < 80 && x.quote.split(' ').length >= 4) {
              pool.push(x.quote.replace(/["""'']/g, ''));
            }
          });
        }
      }
    } catch (_) {}

    // shuffle & pick 5 phrases with 5–10 words
    const eligible = pool
      .filter(p => { const w = p.split(' ').length; return w >= 5 && w <= 10; })
      .sort(() => Math.random() - 0.5);

    phrases = eligible.slice(0, TOTAL_ROUNDS);
    if (phrases.length < TOTAL_ROUNDS) {
      phrases = FALLBACK_CORPUS.slice(0, TOTAL_ROUNDS);
    }
  }


  /* ── Start round ─────────────────────────────────────────── */
  function startRound() {
    if (round >= TOTAL_ROUNDS) { showOverlay(); return; }

    const phrase   = phrases[round];
    currentWords   = phrase.split(' ');
    scrambled      = PLGames.shuffle(currentWords.map((w, i) => ({ word: w, idx: i })));
    answer         = [];
    roundActive    = true;
    timeLeft       = TIME_LIMIT;

    elRound.textContent   = round + 1;
    elStatus.textContent  = 'Descramble the signal.';
    elPhrase.textContent  = '';

    renderChips();
    renderAnswer();
    startTimer();

    ghostWords = currentWords.concat(currentWords).sort(() => Math.random() - 0.5);
  }

  function renderChips() {
    elScramble.innerHTML = '';
    scrambled.forEach((item, si) => {
      const chip = document.createElement('div');
      chip.className = 'word-chip';
      chip.textContent = item.word;
      chip.dataset.si = si;
      if (answer.some(a => a.si === si)) chip.classList.add('used');
      chip.addEventListener('click', () => pickWord(si));
      elScramble.appendChild(chip);
    });
  }

  function renderAnswer() {
    elAnswer.innerHTML = '';
    answer.forEach((a, ai) => {
      const chip = document.createElement('div');
      chip.className = 'answer-chip';
      chip.textContent = a.word;
      chip.addEventListener('click', () => returnWord(ai));
      elAnswer.appendChild(chip);
    });
  }

  function pickWord(si) {
    if (!roundActive) return;
    const item = scrambled[si];
    answer.push({ word: item.word, si });
    renderChips();
    renderAnswer();
  }

  function returnWord(ai) {
    if (!roundActive) return;
    answer.splice(ai, 1);
    renderChips();
    renderAnswer();
  }

  /* ── Timer ───────────────────────────────────────────────── */
  function startTimer() {
    clearInterval(timerInt);
    timerInt = setInterval(() => {
      timeLeft--;
      elTimer.textContent = timeLeft;
      elTimerBar.style.width = (timeLeft / TIME_LIMIT * 100) + '%';
      if (timeLeft <= 10) elTimerBar.style.background = '#a03c3c';
      else elTimerBar.style.background = 'var(--gold)';
      if (timeLeft <= 0) timeOut();
    }, 1000);
  }

  function stopTimer() { clearInterval(timerInt); }

  function timeOut() {
    stopTimer();
    roundActive = false;
    elStatus.textContent = 'Time. Moving on.';
    elPhrase.textContent = phrases[round];
    elPhrase.style.color = 'var(--ash)';
    setTimeout(() => {
      elPhrase.style.color = '';
      round++;
      startRound();
    }, 2000);
  }

  /* ── Check ───────────────────────────────────────────────── */
  function checkAnswer() {
    if (!roundActive || answer.length === 0) return;
    const attempt = answer.map(a => a.word).join(' ');
    const correct  = currentWords.join(' ');

    if (attempt === correct) {
      stopTimer();
      roundActive = false;
      correctCount++;
      elCorrect.textContent = correctCount;
      elStatus.textContent  = 'Signal received.';
      elPhrase.textContent  = phrases[round];
      elPhrase.style.color  = 'var(--gold)';

      elReveal.style.opacity = '1';
      setTimeout(() => { elReveal.style.opacity = '0'; }, 2500);

      elAnswer.classList.add('correct-flash');
      setTimeout(() => { elAnswer.classList.remove('correct-flash'); }, 400);

      setTimeout(() => {
        elPhrase.style.color = '';
        round++;
        startRound();
      }, 2000);
    } else {
      elStatus.textContent = 'Not quite. Try again.';
      elAnswer.style.borderBottomColor = 'rgba(200,80,80,0.4)';
      setTimeout(() => { elAnswer.style.borderBottomColor = ''; elStatus.textContent = 'Descramble the signal.'; }, 800);
    }
  }

  /* ── Overlay ─────────────────────────────────────────────── */
  function showOverlay() {
    stopTimer();
    elOverScore.textContent = `${correctCount} of ${TOTAL_ROUNDS} signals decoded`;
    elOverlay.classList.add('visible');
  }

  function restart() {
    elOverlay.classList.remove('visible');
    round = 0;
    correctCount = 0;
    elCorrect.textContent = 0;
    elTimerBar.style.width = '100%';
    elTimerBar.style.background = 'var(--gold)';
    loadPhrases().then(startRound);
  }

  clearBtn.addEventListener('click', () => {
    if (!roundActive) return;
    answer = [];
    renderChips();
    renderAnswer();
  });
  checkBtn.addEventListener('click', checkAnswer);
  restartBtn.addEventListener('click', restart);

  /* ── p5 ghost backdrop ───────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      loadPhrases().then(startRound);
      return;
    }

    const ALL_WORDS = VAULT_PHRASES.flatMap(p => p.split(' '));
    const floaters  = Array.from({ length: 30 }, () => ({
      word:  ALL_WORDS[Math.floor(Math.random() * ALL_WORDS.length)],
      x:     Math.random(),
      y:     Math.random(),
      vy:    -(0.0003 + Math.random() * 0.0005),
      alpha: 5 + Math.random() * 18,
    }));

    const sketch = p => {
      let fnt;
      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-host');
        p.textFont('Inter');
      };

      p.draw = () => {
        p.clear();
        p.textSize(12);
        p.textStyle(p.NORMAL);
        floaters.forEach(f => {
          f.y += f.vy;
          if (f.y < -0.05) {
            f.y = 1.05;
            f.x = Math.random();
            f.word = ALL_WORDS[Math.floor(Math.random() * ALL_WORDS.length)];
          }
          p.fill(201, 168, 76, f.alpha);
          p.noStroke();
          p.text(f.word, f.x * p.width, f.y * p.height);
        });
      };

      p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
    };

    new p5(sketch);
    loadPhrases().then(startRound);
  });
</script>
</body>
