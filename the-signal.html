  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#B8861C;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Signal</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">The signal runs beneath everything. This is not noise — it is doctrine in transmission. Tune in. Hold the frequency.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#B8861C;color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>

  <div id="canvas-host"></div>

  <div id="plhand-end">Watch this.</div>

<script>
  /* ── LEXICON lenses ──────────────────────────────────────── */
  const LENSES = [
    { id: 'DOCTRINE',  color: [184,134,28],  words: ['practice','reality','persist','control','signal','return','prepare'] },
    { id: 'VOICE',     color: [180,140,80],  words: ['declare','speak','truth','clarity','command','broadcast','tone'] },
    { id: 'RECORD',    color: [140,110,60],  words: ['archive','document','history','trace','mark','encode','preserve'] },
    { id: 'VAULT',     color: [100,80,40],   words: ['store','keep','lock','protect','hold','seal','contain'] },
  ];

  const ALL_WORDS = LENSES.flatMap(l => l.words.map(w => ({ text: w.toUpperCase(), lens: l.id })));

  const FALLBACK_FRAGMENTS = [
    { text: 'PRACTICE', lens: 'DOCTRINE' },
    { text: 'REALITY',  lens: 'DOCTRINE' },
    { text: 'DECLARE',  lens: 'VOICE'    },
    { text: 'ARCHIVE',  lens: 'RECORD'   },
    { text: 'PERSIST',  lens: 'DOCTRINE' },
    { text: 'SIGNAL',   lens: 'DOCTRINE' },
    { text: 'MARK',     lens: 'RECORD'   },
    { text: 'VAULT',    lens: 'VAULT'    },
    { text: 'SPEAK',    lens: 'VOICE'    },
    { text: 'STORE',    lens: 'VAULT'    },
  ];

  const elHand = document.getElementById('plhand-end');
  const FALLBACK_END = elHand.textContent;
  let endPhrase = FALLBACK_END;
  if (window.PLGames) PLGames.seed().then(function (s) { if (s && s.phrase) endPhrase = s.phrase; });

  let SEED_FRAGMENTS = [];
  if (window.PLGames) {
    PLGames.seeds(16).then(function (seeds) {
      // ponytail: lens assigned randomly, no semantic classifier
      SEED_FRAGMENTS = (seeds || [])
        .map(function (s) {
          var w = (s.phrase || '').split('\u2014')[0].trim().split(/\s+/)[0];
          if (!w) return null;
          var lens = LENSES[Math.floor(Math.random() * LENSES.length)];
          return { text: w.toUpperCase(), lens: lens.id };
        })
        .filter(Boolean);
    });
  }

  const sketch = p => {
    const W = () => p.windowWidth;
    const H = () => p.windowHeight;

    let LIVES       = 3;
    let score       = 0;
    let speed       = 1;
    let catcherX    = 0;
    let catcherW    = 160;
    let activeLens  = null;
    let items       = [];
    let particles   = [];
    let spawnTimer  = 0;
    let spawnRate   = 90;
    let gameOver    = false;
    let started     = false;
    let handShown   = false;
    let dragStart   = null;
    let catcherVel  = 0;

    const GOLD = [184, 134, 28];
    const BONE = [10,  10,  10];
    const ASH  = [58,  48,  32];
    const VOID = [248, 242, 228];

    p.setup = () => {
      const cnv = p.createCanvas(W(), H());
      cnv.parent('canvas-host');
      catcherX = W() / 2;
      activeLens = LENSES[Math.floor(Math.random() * LENSES.length)];
    };

    function spawnItem() {
      const all = SEED_FRAGMENTS.length ? SEED_FRAGMENTS : [...ALL_WORDS, ...FALLBACK_FRAGMENTS];
      const item = all[Math.floor(Math.random() * all.length)];
      const isTarget = item.lens === activeLens.id;
      items.push({
        text:     item.text,
        lens:     item.lens,
        x:        p.random(60, W() - 60),
        y:        -20,
        vy:       (1.2 + score * 0.01) * speed,
        isTarget,
        alpha:    255,
        caught:   false,
        missed:   false,
      });
    }

    p.draw = () => {
      p.background(...VOID);

      if (!started) {
        drawStart();
        return;
      }

      if (gameOver) {
        drawGameOver();
        return;
      }

      // move catcher with mouse/touch
      const targetX = p.mouseX || W() / 2;
      catcherVel = (targetX - catcherX) * 0.15;
      catcherX   = p.constrain(catcherX + catcherVel, catcherW / 2, W() - catcherW / 2);

      // spawn
      spawnTimer++;
      if (spawnTimer >= spawnRate) {
        spawnTimer = 0;
        spawnRate  = Math.max(30, 90 - score * 2);
        spawnItem();
      }

      // speed ramp
      speed = 1 + score * 0.03;

      // draw items
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        if (it.caught || it.missed) { items.splice(i, 1); continue; }

        it.y += it.vy;

        // check catch
        const cy = H() - 50;
        if (it.y > cy - 10 && it.y < cy + 20 &&
            it.x > catcherX - catcherW / 2 - 10 &&
            it.x < catcherX + catcherW / 2 + 10) {
          if (it.isTarget) {
            score++;
            emitParticles(it.x, cy, GOLD);
          } else {
            LIVES--;
            emitParticles(it.x, cy, [180, 60, 60]);
            if (LIVES <= 0) { gameOver = true; showHand(); return; }
          }
          it.caught = true;
          continue;
        }

        // missed
        if (it.y > H() + 10) {
          if (it.isTarget) {
            LIVES--;
            if (LIVES <= 0) { gameOver = true; showHand(); return; }
          }
          it.missed = true;
          continue;
        }

        // draw word
        const lensObj = LENSES.find(l => l.id === it.lens) || LENSES[0];
        p.fill(...lensObj.color, it.isTarget ? 230 : 80);
        p.noStroke();
        p.textAlign(p.CENTER, p.CENTER);
        p.textSize(it.isTarget ? 14 : 11);
        p.textStyle(p.NORMAL);
        p.text(it.text, it.x, it.y);
      }

      // draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x    += pt.vx;
        pt.y    += pt.vy;
        pt.alpha -= 8;
        if (pt.alpha <= 0) { particles.splice(i, 1); continue; }
        p.fill(...pt.col, pt.alpha);
        p.noStroke();
        p.ellipse(pt.x, pt.y, 4);
      }

      // draw catcher
      const cy = H() - 50;
      p.stroke(...GOLD, 180);
      p.strokeWeight(2);
      p.noFill();
      p.rect(catcherX - catcherW / 2, cy - 14, catcherW, 28, 4);

      p.fill(...GOLD, 120);
      p.noStroke();
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(9);
      p.text(activeLens.id, catcherX, cy);

      // HUD
      drawHUD();
    };

    function drawHUD() {
      p.fill(...GOLD);
      p.noStroke();
      p.textAlign(p.LEFT, p.TOP);
      p.textSize(9);
      p.text(`SCORE  ${score}`, 24, 24);
      p.textAlign(p.RIGHT, p.TOP);
      p.text(`LIVES  ${LIVES}`, W() - 24, 24);

      // lens label
      p.textAlign(p.CENTER, p.TOP);
      p.fill(...GOLD, 60);
      p.textSize(9);
      p.text(`CATCH: ${activeLens.id}`, W() / 2, 24);

      // lens change hint
      if (score > 0 && score % 5 === 0) {
        activeLens = LENSES[Math.floor(Math.random() * LENSES.length)];
      }
    }

    function emitParticles(x, y, col) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: p.random(-3, 3),
          vy: p.random(-5, -1),
          alpha: 200,
          col,
        });
      }
    }

    function drawStart() {
      p.fill(...GOLD);
      p.noStroke();
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(11);
      p.text('THE SIGNAL', W() / 2, H() / 2 - 48);
      p.fill(...BONE, 160);
      p.textSize(10);
      p.text('Catch words that match the lens.', W() / 2, H() / 2 - 10);
      p.text('Ignore noise. The signal is doctrine.', W() / 2, H() / 2 + 14);
      p.fill(...GOLD, 120);
      p.textSize(9);
      p.text('CLICK TO BEGIN', W() / 2, H() / 2 + 52);
    }

    function drawGameOver() {
      p.fill(...GOLD);
      p.noStroke();
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(12);
      p.text('SIGNAL LOST', W() / 2, H() / 2 - 40);
      p.fill(...BONE, 180);
      p.textSize(10);
      p.text(`${score} signals decoded`, W() / 2, H() / 2 - 6);
      p.fill(...GOLD, 80);
      p.textSize(9);
      p.text('CLICK TO RETURN', W() / 2, H() / 2 + 40);
    }

    function showHand() {
      if (handShown) return;
      handShown = true;
      elHand.textContent = endPhrase;
      elHand.style.opacity = '1';
      setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
    }

    p.mousePressed = () => {
      if (!started) { started = true; return; }
      if (gameOver) {
        gameOver  = false;
        started   = false;
        LIVES     = 3;
        score     = 0;
        speed     = 1;
        items     = [];
        particles = [];
        handShown = false;
        activeLens = LENSES[Math.floor(Math.random() * LENSES.length)];
      }
    };

    p.touchStarted = () => { p.mousePressed(); return false; };

    p.windowResized = () => {
      p.resizeCanvas(W(), H());
      catcherX = W() / 2;
    };
  };

  document.addEventListener('DOMContentLoaded', () => {
    new p5(sketch);
  });
</script>
</body>
