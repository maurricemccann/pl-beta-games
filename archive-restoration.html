<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive Restoration — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --void:#F0EAF8; --gold:#6B3FA8; --gold-dim:#4A2880; --gold-muted:#7B50B8; --bone:#0A0A0A; --ash:#7A6090; --border:#C4A8E8; }
    html, body { width:100%; min-height:100%; background:var(--void); color:var(--bone); font-family:'PLHand',cursive; overflow-x:hidden; }
    #p5-host { position:fixed; inset:0; z-index:0; pointer-events:none; }
    #p5-host canvas { display:block; width:100%!important; height:100%!important; }
    .page { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:80px 24px 120px; max-width:680px; margin:0 auto; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--ash); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #progress-bar-wrap { position:fixed; top:0; left:0; right:0; height:2px; z-index:20; }
    #progress-bar { height:100%; background:var(--gold); width:0%; transition:width 0.5s; }
    #archive-header { text-align:center; margin-bottom:40px; }
    #frag-count { font-family:'Cormorant Garamond',serif; font-size:clamp(36px,8vw,60px); color:var(--gold); font-weight:300; line-height:1; }
    #frag-label { font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:8px; }
    #progress-text { font-size:10px; color:var(--ash); letter-spacing:0.2em; }
    #fragment-reveal { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(14px,2.5vw,18px); color:var(--gold-muted); line-height:1.6; padding:20px; border:1px solid var(--border); background:#E0D4F0; max-width:540px; width:100%; min-height:80px; text-align:center; margin-bottom:32px; }
    #collect-btn { padding:12px 32px; background:#E0D4F0; border:1px solid var(--gold-dim); color:var(--gold); font-size:10px; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; margin-bottom:40px; }
    #collect-btn:hover { border-color:var(--gold); }
    #collect-btn:disabled { opacity:0.3; cursor:default; }
    #collected-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:6px; width:100%; max-width:540px; }
    .frag-card { border:1px solid var(--border); padding:12px 14px; background:#E0D4F0; }
    .frag-card.unlocked { border-color:var(--gold-dim); background:rgba(201,168,76,0.04); }
    .frag-num { font-size:9px; letter-spacing:0.3em; color:var(--gold-dim); margin-bottom:6px; }
    .frag-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:12px; color:var(--bone); line-height:1.5; }
    .frag-locked { font-size:20px; color:#1a1a1a; text-align:center; padding:8px 0; }
    #plhand { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(18px,3.5vw,26px); color:var(--gold);
      opacity:0; transition:opacity 0.6s; pointer-events:none; white-space:nowrap; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F0EAF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#6B3FA8;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Archive Restoration</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A1880;line-height:1.7;margin-bottom:36px;">The archive was scattered. Each fragment you restore adds evidence. The practice is the restoration. Keep going.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#6B3FA8;color:#F0EAF8;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="p5-host"></div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div class="page">
    <div id="archive-header">
      <div id="frag-count">0</div>
      <div id="frag-label">Fragments Restored</div>
      <div id="progress-text">of 20</div>
    </div>
    <div id="fragment-reveal">Return each session. Restore the archive one fragment at a time.</div>
    <button id="collect-btn">Restore Fragment</button>
    <div id="collected-grid"></div>
  </div>
  <div id="plhand">The archive lives.</div>

<script>
  /* ── 20 archive fragments from vault doctrine ─────────────── */
  const FRAGMENTS = [
    { id: 1, text: "April 29th, 2019. A piece of chalk. A curve remembered from childhood. The practice begins." },
    { id: 2, text: "The brand was called Psychedleo before it had a name. The pattern was presented to the world through Instagram." },
    { id: 3, text: "Psyched Luxuries exists to teach the practice of reality creation — proof it works, proof it spreads." },
    { id: 4, text: "Before the practice: living day to day, no direction, no sense of what the future held." },
    { id: 5, text: "The practice cost thousands of dollars. Thousands of hours. Physical pain. Blood, sweat, tears. Paid again." },
    { id: 6, text: "What it gave back: a vast catalog, a confidence that wouldn't exist if the brand didn't. A superpower." },
    { id: 7, text: "Seven years without a single day off. Not motivation — persistence. Created despite conditions." },
    { id: 8, text: "The first tag: three curves that look like a rose. Still true today." },
    { id: 9, text: "The doubters came. The response was to produce uncontrollably and expand in spite." },
    { id: 10, text: "1,768 pieces catalogued. 90% governed by the Curve. The data confirms what the doctrine declared." },
    { id: 11, text: "Glyph is the dominant subject — 608 pieces, 34% of the archive. Before all else: a mark-making practice." },
    { id: 12, text: "57% hand-made. 43% digital. The hand leads. The ink and marker trace a lineage through centuries." },
    { id: 13, text: "The Curve is the governing law. Not a style. Not a tendency. A measured law of the hand." },
    { id: 14, text: "Gold on black: the brand's signature axis. Declaration on darkness. Prepared for luxury." },
    { id: 15, text: "The Three Truths: Prepared for luxury. You are in control of your reality. What persists in the mind becomes your reality." },
    { id: 16, text: "The Congregation — those who receive the signal. The frequency self-selects. The brand doesn't recruit." },
    { id: 17, text: "Wearable art: not merchandise. Not product. The philosophy made physical, carried into the world." },
    { id: 18, text: "Three Bodies of Work: Commercial (storefront), Fine Art (private archive), The Defiance (healing through the hurt — the Golden Mend)." },
    { id: 19, text: "The Dissolution: before the practice. The return from it. The practice was born from what was lost." },
    { id: 20, text: "Watch this. Not a boast. A direction of attention. The moment is here. The archive is the proof." },
  ];

  const KEY = 'pl_archive_restoration';
  const GAME = 'archive_restoration';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { restored: [], lastSession: null }; } catch { return { restored: [], lastSession: null }; } }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
    if (window.PLGames) PLGames.save(GAME, s);   // local copy + D1 when signed in
  }

  let state       = load();
  const sessionKey = new Date().toISOString().slice(0, 10);
  let canCollect = state.lastSession !== sessionKey;

  const elCount   = document.getElementById('frag-count');
  const elReveal  = document.getElementById('fragment-reveal');
  const elBtn     = document.getElementById('collect-btn');
  const elGrid    = document.getElementById('collected-grid');
  const elBar     = document.getElementById('progress-bar');
  const elHand    = document.getElementById('plhand');
  let pulses      = [];

  function nextFragment() {
    return FRAGMENTS.find(f => !state.restored.includes(f.id));
  }

  function render() {
    const count = state.restored.length;
    elCount.textContent = count;
    elBar.style.width   = (count / FRAGMENTS.length * 100) + '%';

    const next = nextFragment();
    if (!canCollect || !next) {
      elBtn.disabled = true;
      elBtn.textContent = next ? 'Return tomorrow.' : 'Archive fully restored.';
    }
    if (next && canCollect) {
      elReveal.textContent = next.text;
    } else if (!next) {
      elReveal.textContent = 'The archive is restored. The practice is the proof.';
      elHand.style.opacity = '1';
      setTimeout(() => { elHand.style.opacity = '0'; }, 4000);
    } else {
      elReveal.textContent = 'Return next session to restore the next fragment.';
    }

    elGrid.innerHTML = '';
    FRAGMENTS.forEach(f => {
      const card = document.createElement('div');
      const unlocked = state.restored.includes(f.id);
      card.className = 'frag-card' + (unlocked ? ' unlocked' : '');
      card.innerHTML = unlocked
        ? `<div class="frag-num">Fragment ${f.id}</div><div class="frag-text">${f.text}</div>`
        : `<div class="frag-num">Fragment ${f.id}</div><div class="frag-locked">▣</div>`;
      elGrid.appendChild(card);
    });
  }

  function collect() {
    const next = nextFragment();
    if (!next || !canCollect) return;
    state.restored.push(next.id);
    state.lastSession = sessionKey;
    save(state);
    pulses.push(1);
    elBtn.disabled = true;
    elBtn.textContent = 'Return tomorrow.';
    render();
    if (state.restored.length % 5 === 0) {
      elHand.style.opacity = '1';
      setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
    }
  }

  elBtn.addEventListener('click', collect);
  render();

  /* ── cross-device: merge D1 state when signed in ── */
  if (window.PLGames) {
    PLGames.load(GAME).then(remote => {
      if (!remote || !Array.isArray(remote.restored)) return;
      state.restored = Array.from(new Set([...(state.restored || []), ...remote.restored]));
      if (remote.lastSession && (!state.lastSession || remote.lastSession > state.lastSession)) state.lastSession = remote.lastSession;
      save(state);
      canCollect = state.lastSession !== sessionKey;
      render();
    }).catch(() => {});
  }

  const sketch = p => {
    let lines = Array.from({length:8}, () => ({ x:Math.random(), y:Math.random(), len:0.05+Math.random()*0.08, vx:(Math.random()-0.5)*0.0001, vy:0.00008+Math.random()*0.0001, alpha:5+Math.random()*8 }));
    p.setup = () => { const cnv = p.createCanvas(p.windowWidth, p.windowHeight); cnv.parent('p5-host'); };
    p.draw = () => {
      p.clear();
      while (pulses.length > 0) { pulses.pop(); for (let i=0;i<6;i++) lines.push({ x:Math.random(), y:Math.random(), len:0.06, vx:(Math.random()-0.5)*0.0003, vy:0.0002, alpha:40 }); }
      lines.forEach(l => {
        l.x+=l.vx; l.y+=l.vy; if(l.y>1.1){l.y=-0.1;l.x=Math.random();}
        p.stroke(201,168,76,l.alpha); p.strokeWeight(1);
        p.line(l.x*p.windowWidth, l.y*p.windowHeight, (l.x+l.len)*p.windowWidth, (l.y+l.len*0.2)*p.windowHeight);
      });
    };
    p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
  };
  document.addEventListener('DOMContentLoaded', () => { new p5(sketch); });
</script>
</body>
