<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth 3 Live — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --void:#F0EAF8; --gold:#6B3FA8; --gold-dim:#4A2880; --gold-muted:#7B50B8; --bone:#0A0A0A; --ash:#7A6090; --border:#C4A8E8; }
    html, body { width:100%; min-height:100%; background:var(--void); color:var(--bone); font-family:'PLHand',cursive; overflow-x:hidden; }
    #p5-host { position:fixed; inset:0; z-index:0; pointer-events:none; }
    #p5-host canvas { display:block; width:100%!important; height:100%!important; }
    .page { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:80px 24px 120px; max-width:600px; margin:0 auto; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--ash); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #law3-header { text-align:center; margin-bottom:40px; }
    #law3-title { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(18px,4vw,28px); color:var(--gold); margin-bottom:12px; }
    #day-counter { font-size:clamp(36px,8vw,60px); color:var(--gold); font-family:'Cormorant Garamond',serif; font-weight:300; line-height:1; margin-bottom:8px; }
    #day-label { font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold-dim); }
    #intention-section { width:100%; max-width:500px; margin-bottom:32px; }
    #current-intention { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(15px,2.5vw,19px); color:var(--bone); line-height:1.6; padding:16px 20px; border:1px solid var(--border); background:#E0D4F0; min-height:60px; margin-bottom:12px; }
    #intention-input { width:100%; background:#E0D4F0; border:1px solid var(--border); color:var(--bone); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; padding:12px 16px; outline:none; resize:none; }
    #intention-input:focus { border-color:var(--gold-dim); }
    #intention-input::placeholder { color:var(--ash); }
    .btn { padding:10px 24px; background:#E0D4F0; border:1px solid var(--gold-dim); color:var(--gold); font-size:9px; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; }
    .btn:hover { border-color:var(--gold); }
    .btn:disabled { opacity:0.3; cursor:default; }
    #actions { display:flex; gap:10px; margin-bottom:32px; }
    #timeline { width:100%; max-width:500px; display:flex; flex-direction:column; gap:1px; }
    .timeline-entry { border:1px solid var(--border); padding:12px 16px; display:flex; gap:12px; align-items:flex-start; }
    .te-day { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-dim); white-space:nowrap; padding-top:2px; min-width:48px; }
    .te-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:var(--bone); line-height:1.5; }
    .te-confirmed { border-color:var(--gold-dim); }
    #plhand { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(18px,3.5vw,26px); color:var(--gold);
      opacity:0; transition:opacity 0.6s; pointer-events:none; white-space:nowrap; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F0EAF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#6B3FA8;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Truth 3 Live</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A1880;line-height:1.7;margin-bottom:36px;">What you hold in mind long enough becomes your reality. Set the intention now. Return each day. Watch what builds.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#6B3FA8;color:#F0EAF8;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="p5-host"></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div class="page">
    <div id="law3-header">
      <div id="law3-title">What persists in the mind becomes your reality.</div>
      <div id="day-counter">0</div>
      <div id="day-label">Days Persisted</div>
    </div>
    <div id="intention-section">
      <div id="current-intention">No intention set yet.</div>
      <textarea id="intention-input" rows="2" placeholder="State what you are holding in mind today…" maxlength="200"></textarea>
    </div>
    <div id="actions">
      <button class="btn" id="persistBtn">Persist Today</button>
      <button class="btn" id="clearBtn" style="border-color:#1a1a1a;color:#7A6090;">Clear Intention</button>
    </div>
    <div id="timeline"></div>
  </div>
  <div id="plhand">Persisting.</div>

<script>
  const KEY = 'pl_law3';
  const GAME = 'law3';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { intention: '', entries: [] }; } catch { return { intention: '', entries: [] }; } }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
    if (window.PLGames) PLGames.save(GAME, s);   // local copy + D1 when signed in
  }

  const MILESTONE_MSGS = {
    7:  'Seven days. The mind is holding.',
    14: 'Two weeks. The pattern is encoded.',
    21: 'Three weeks. The architecture is forming.',
    30: 'Thirty days. What persists is now structure.',
  };

  let state = load();
  const today = new Date().toISOString().slice(0, 10);
  const alreadyPersisted = state.entries.length > 0 && state.entries[state.entries.length - 1].date === today;

  const elCounter   = document.getElementById('day-counter');
  const elCurrent   = document.getElementById('current-intention');
  const elInput     = document.getElementById('intention-input');
  const elTimeline  = document.getElementById('timeline');
  const elHand      = document.getElementById('plhand');
  const persistBtn  = document.getElementById('persistBtn');
  const clearBtn_   = document.getElementById('clearBtn');
  let pulses        = [];

  function render() {
    const count = state.entries.length;
    elCounter.textContent = count;
    elCurrent.textContent = state.intention || 'No intention set yet.';
    elInput.value = state.intention || '';

    if (alreadyPersisted || (state.entries.length > 0 && state.entries[state.entries.length-1].date === today)) {
      persistBtn.disabled = true;
      persistBtn.textContent = 'Persisted today.';
    }

    elTimeline.innerHTML = '';
    [...state.entries].reverse().slice(0, 30).forEach(e => {
      const el = document.createElement('div');
      el.className = 'timeline-entry te-confirmed';
      el.innerHTML = `<div class="te-day">${e.date.slice(5)}</div><div class="te-text">${e.text}</div>`;
      elTimeline.appendChild(el);
    });
  }

  function persist() {
    const text = elInput.value.trim() || state.intention;
    if (!text) return;
    state.intention = text;
    if (!alreadyPersisted && (state.entries.length === 0 || state.entries[state.entries.length-1].date !== today)) {
      state.entries.push({ date: today, text });
      save(state);
      pulses.push(1);
      persistBtn.disabled = true;
      persistBtn.textContent = 'Persisted today.';
      const count = state.entries.length;
      if (MILESTONE_MSGS[count]) {
        elHand.style.opacity = '1';
        setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
      }
    } else {
      state.intention = text;
      save(state);
    }
    render();
  }

  persistBtn.addEventListener('click', persist);
  clearBtn_.addEventListener('click', () => { state.intention = ''; save(state); elInput.value = ''; elCurrent.textContent = 'No intention set yet.'; });
  elInput.addEventListener('input', () => { state.intention = elInput.value; });

  render();

  /* Hydrate from the member's saved streak (D1 when signed in; PLGames local otherwise),
     merging entries by date so the day-count survives across devices and sessions. */
  if (window.PLGames) {
    PLGames.load(GAME).then(remote => {
      if (!remote || !Array.isArray(remote.entries) || !remote.entries.length) return;
      const byDate = {};
      [...state.entries, ...remote.entries].forEach(e => { if (e && e.date) byDate[e.date] = e; });
      state.entries = Object.values(byDate).sort((a, b) => (a.date < b.date ? -1 : 1));
      if (!state.intention && remote.intention) state.intention = remote.intention;
      save(state);
      const last = state.entries[state.entries.length - 1];
      if (last && last.date === today) { persistBtn.disabled = true; persistBtn.textContent = 'Persisted today.'; }
      render();
    });
  }

  const sketch = p => {
    let floaters = Array.from({length:12}, () => ({
      word: ['persist','return','hold','mind','reality','become','practice'][Math.floor(Math.random()*7)],
      x: Math.random(), y: Math.random(), vy: -(0.0003+Math.random()*0.0004), alpha: 8+Math.random()*14,
    }));
    p.setup = () => { const cnv = p.createCanvas(p.windowWidth, p.windowHeight); cnv.parent('p5-host'); };
    p.draw = () => {
      p.clear();
      while (pulses.length > 0) {
        pulses.pop();
        for (let i = 0; i < 5; i++) {
          floaters.push({ word: 'persist', x: Math.random(), y: 1, vy: -(0.001+Math.random()*0.002), alpha: 60 });
        }
      }
      p.textSize(11); p.noStroke();
      floaters.forEach(f => {
        f.y += f.vy;
        if (f.y < -0.05) { f.y = 1.05; f.x = Math.random(); }
        p.fill(201,168,76,f.alpha); p.textAlign(p.LEFT,p.TOP);
        p.text(f.word, f.x*p.windowWidth, f.y*p.windowHeight);
      });
    };
    p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
  };
  document.addEventListener('DOMContentLoaded', () => { new p5(sketch); });
</script>
</body>
</html>
