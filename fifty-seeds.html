<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 50 Seeds — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf?v=3') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf?v=3') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --void:#F0EAF8; --gold:#6B3FA8; --gold-dim:#4A2880; --gold-muted:#7B50B8; --bone:#0A0A0A; --ash:#7A6090; --border:#C4A8E8; }
    html, body { width:100%; min-height:100%; background:var(--void); color:var(--bone); font-family:'PLHand',cursive; overflow-x:hidden; }
    #p5-host { position:fixed; inset:0; z-index:0; pointer-events:none; }
    #p5-host canvas { display:block; width:100%!important; height:100%!important; }
    .page { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:80px 24px 120px; max-width:680px; margin:0 auto; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--ash); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #progress-bar-wrap { position:fixed; top:0; left:0; right:0; height:2px; z-index:20; }
    #progress-bar { height:100%; background:var(--gold); transition:width 0.5s; }
    #header { text-align:center; margin-bottom:40px; }
    #seeds-found { font-family:'Cormorant Garamond',serif; font-size:clamp(40px,8vw,64px); color:var(--gold); font-weight:300; }
    #seeds-label { font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold-dim); }
    #seed-input-section { width:100%; max-width:520px; display:flex; gap:8px; margin-bottom:40px; }
    #seed-input { flex:1; background:#E0D4F0; border:1px solid var(--border); color:var(--bone); font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16px; padding:12px 16px; outline:none; }
    #seed-input:focus { border-color:var(--gold-dim); }
    #seed-input::placeholder { color:var(--ash); }
    #check-btn { padding:12px 20px; background:#E0D4F0; border:1px solid var(--gold-dim); color:var(--gold); font-size:9px; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
    #check-btn:hover { border-color:var(--gold); }
    #feedback { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(14px,2.5vw,17px); color:var(--gold-muted); text-align:center; min-height:32px; margin-bottom:32px; }
    #seeds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:4px; width:100%; max-width:560px; }
    .seed-cell { border:1px solid var(--border); padding:10px 12px; background:#E0D4F0; }
    .seed-cell.found { border-color:var(--gold-dim); background:rgba(201,168,76,0.06); }
    .seed-num { font-size:9px; letter-spacing:0.3em; color:var(--gold-dim); margin-bottom:4px; }
    .seed-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; color:var(--bone); line-height:1.4; }
    .seed-locked { font-size:18px; color:#1a1a1a; }
    #plhand { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(18px,3.5vw,26px); color:var(--gold);
      opacity:0; transition:opacity 0.6s; pointer-events:none; white-space:nowrap; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F0EAF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#6B3FA8;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Fifty Seeds</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A1880;line-height:1.7;margin-bottom:36px;">Fifty seed phrases hidden inside the archive. Each one a different beginning. Find them all. The vault is deeper than it looks.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#6B3FA8;color:#F0EAF8;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="p5-host"></div>
  <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div class="page">
    <div id="header">
      <div id="seeds-found">0</div>
      <div id="seeds-label">of 50 Seeds Found</div>
    </div>
    <div id="seed-input-section">
      <input id="seed-input" placeholder="Enter a seed phrase to unlock it…" maxlength="80">
      <button id="check-btn">Plant</button>
    </div>
    <div id="feedback"></div>
    <div id="seeds-grid"></div>
  </div>
  <div id="plhand">All 50 seeds planted.</div>

<script>
  /* ── 50 real vault seed phrases ─────────────────────────────── */
  // The fifty are REAL seeds from the library (voice-clean, via the PLGames spine).
  // Fetched once and cached as this player's stable set, so "find them all" holds across visits.
  const SEEDSET_KEY = 'pl_50_seedset';
  let ALL_SEEDS = (function () { try { return JSON.parse(localStorage.getItem(SEEDSET_KEY)) || []; } catch { return []; } })();

  // normalize: lowercase, remove punctuation
  function normalize(s) { return s.toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim(); }

  let SEED_MAP = {};
  function rebuildMap() { SEED_MAP = {}; ALL_SEEDS.forEach((s, i) => { SEED_MAP[normalize(s)] = i; }); }
  rebuildMap();

  async function ensureSeeds() {
    if (ALL_SEEDS.length >= 50) return;
    try {
      const s = (window.PLGames && await window.PLGames.seeds(50)) || [];
      const phrases = [...new Set(s.map(x => x.phrase).filter(Boolean))].slice(0, 50);
      if (phrases.length) {
        ALL_SEEDS = phrases;
        try { localStorage.setItem(SEEDSET_KEY, JSON.stringify(ALL_SEEDS)); } catch {}
        rebuildMap();
        render();
      }
    } catch (e) { /* the library is quiet — grid waits */ }
  }

  const KEY = 'pl_50_seeds';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function save(f) { try { localStorage.setItem(KEY, JSON.stringify(f)); } catch {} }

  let found = load();
  const elCount    = document.getElementById('seeds-found');
  const elInput    = document.getElementById('seed-input');
  const elFeedback = document.getElementById('feedback');
  const elGrid     = document.getElementById('seeds-grid');
  const elBar      = document.getElementById('progress-bar');
  const elHand     = document.getElementById('plhand');
  let pulses       = [];

  function render() {
    elCount.textContent = found.length;
    elBar.style.width   = (found.length / 50 * 100) + '%';
    elGrid.innerHTML    = '';
    ALL_SEEDS.forEach((seed, i) => {
      const cell = document.createElement('div');
      const isFound = found.includes(i);
      cell.className = 'seed-cell' + (isFound ? ' found' : '');
      cell.innerHTML = isFound
        ? `<div class="seed-num">Seed ${i+1}</div><div class="seed-text">${seed}</div>`
        : `<div class="seed-num">Seed ${i+1}</div><div class="seed-locked">◈</div>`;
      elGrid.appendChild(cell);
    });
  }

  function plant() {
    const val = elInput.value.trim();
    if (!val) return;
    const norm = normalize(val);
    if (norm in SEED_MAP) {
      const idx = SEED_MAP[norm];
      if (found.includes(idx)) {
        elFeedback.textContent = 'Already in the archive.';
      } else {
        found.push(idx);
        save(found);
        pulses.push(1);
        elFeedback.textContent = `Seed ${idx+1} planted: ${ALL_SEEDS[idx]}`;
        render();
        if (found.length === 50) {
          elHand.style.opacity = '1';
          setTimeout(() => { elHand.style.opacity = '0'; }, 4000);
        }
      }
    } else {
      elFeedback.textContent = 'Not a known seed. Search the other games.';
    }
    elInput.value = '';
    setTimeout(() => { elFeedback.textContent = ''; }, 3000);
  }

  document.getElementById('check-btn').addEventListener('click', plant);
  elInput.addEventListener('keydown', e => { if (e.key === 'Enter') plant(); });
  render();
  ensureSeeds();

  const sketch = p => {
    p.setup = () => { const cnv = p.createCanvas(p.windowWidth, p.windowHeight); cnv.parent('p5-host'); };
    let particles = [];
    p.draw = () => {
      p.clear();
      while (pulses.length > 0) {
        pulses.pop();
        for (let i=0;i<20;i++) {
          const a = p.random(p.TWO_PI);
          particles.push({ x:p.windowWidth/2, y:p.windowHeight/2, vx:Math.cos(a)*p.random(2,6), vy:Math.sin(a)*p.random(2,6), alpha:120 });
        }
      }
      for (let i=particles.length-1;i>=0;i--) {
        const pt=particles[i]; pt.x+=pt.vx; pt.y+=pt.vy; pt.alpha-=4;
        if(pt.alpha<=0){particles.splice(i,1);continue;}
        p.fill(201,168,76,pt.alpha); p.noStroke(); p.ellipse(pt.x,pt.y,3);
      }
    };
    p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
  };
  document.addEventListener('DOMContentLoaded', () => { new p5(sketch); });
</script>
</body>
</html>
