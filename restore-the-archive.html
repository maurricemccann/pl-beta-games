<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restore The Archive — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --void: #F8F2E4;
      --gold: #B8861C;
      --gold-dim: #7A5C14;
      --gold-muted: #9A7020;
      --bone: #0A0A0A;
      --ash: #3A3020;
      --border: #D4AF6A;
      --btn-bg: #EDE5CE;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--bone);
      font-family: 'PLHand', cursive;
      overflow: hidden;
      user-select: none;
    }

    #p5-host {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #p5-host canvas { display: block; width: 100% !important; height: 100% !important; }

    .page {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .nav-bar {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
    }
    .nav-link {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--ash);
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav-link:hover { color: var(--gold); }

    #hud {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold-dim);
      white-space: nowrap;
    }
    #hud strong { color: var(--gold); font-weight: 300; }

    #status-msg {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ash);
      margin-bottom: 20px;
      height: 16px;
    }

    #puzzle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      width: min(320px, 80vw);
      height: min(320px, 80vw);
    }

    @media (max-width: 400px) {
      #puzzle-grid { width: 260px; height: 260px; }
    }

    .tile {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: var(--gold);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, transform 0.1s;
      aspect-ratio: 1;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 4px;
      line-height: 1.2;
    }
    .tile:hover { border-color: var(--gold-dim); }
    .tile.empty {
      background: transparent;
      border-color: #0e0e0e;
      cursor: default;
      pointer-events: none;
    }
    .tile.correct {
      background: rgba(201,168,76,0.12);
      border-color: var(--gold-dim);
    }
    .tile.moved { transform: scale(0.94); }
    .tile.img {
      background-size: 400% 400%;
      background-repeat: no-repeat;
      color: transparent;
      border-color: var(--gold-dim);
    }

    #overlay-piece {
      width: min(240px, 64vw);
      aspect-ratio: 1;
      object-fit: cover;
      border: 1px solid var(--gold-dim);
      display: none;
    }
    #overlay-cr {
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold-muted);
    }

    #plhand-win {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'PLHand', cursive;
      font-size: clamp(18px, 3.5vw, 26px);
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      white-space: nowrap;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(8,8,8,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }
    #overlay-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(22px, 5vw, 36px);
      color: var(--gold);
    }
    #overlay-moves {
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--ash);
    }
    #overlay-hand {
      font-family: 'PLHand', cursive;
      font-size: clamp(18px, 4vw, 28px);
      color: var(--gold);
    }

    .btn {
      padding: 10px 24px;
      background: var(--btn-bg);
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn:hover { border-color: var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
      #p5-host { display: none; }
    }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#B8861C;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Restore the Archive</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">Seven years of daily pieces, scattered. Restore what belongs together. Each fragment you recover adds weight.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#B8861C;color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>

  <div id="p5-host"></div>

  <nav class="nav-bar">
    <a class="nav-link" href="index.html">← Games</a>
  </nav>

  <div id="hud">Moves: <strong id="moveCount">0</strong></div>

  <div class="page">
    <div id="status-msg">Restore the archive.</div>
    <div id="puzzle-grid"></div>
  </div>

  <div id="plhand-win">The archive lives.</div>

  <div id="overlay">
    <img id="overlay-piece" alt="">
    <div id="overlay-title">Archive Restored</div>
    <div id="overlay-cr"></div>
    <div id="overlay-moves"></div>
    <div id="overlay-hand">Watch this.</div>
    <button class="btn" id="restartBtn" style="margin-top:12px">Restore Again</button>
  </div>

<script>
  /* ── Archive fragments for tiles ─────────────────────────── */
  const ARCHIVE_WORDS = [
    'CURVE', 'MARK', 'GLYPH', 'VOID',
    'GOLD', 'PRACTICE', 'PATTERN', 'FIGURE',
    'SIGNAL', 'ARCHIVE', 'PERSIST', 'CONTROL',
    'PREPARE', 'RETURN', 'DESCENT',
  ];

  /* ── State ───────────────────────────────────────────────── */
  const SIZE      = 4;
  const TOTAL     = SIZE * SIZE; // 16, tile 15 = empty
  let board       = [];
  let moveCount   = 0;
  let solved      = false;
  let winShown    = false;
  let currentPiece = null;   // real archive piece being restored (PLGames)

  function loadPiece() {
    if (!window.PLGames) return Promise.resolve(null);
    return PLGames.randomPiece().then(p => { currentPiece = p; return p; })
                                .catch(() => { currentPiece = null; return null; });
  }

  const elStatus  = document.getElementById('status-msg');
  const elMoves   = document.getElementById('moveCount');
  const elGrid    = document.getElementById('puzzle-grid');
  const elWin     = document.getElementById('plhand-win');
  const elOverlay = document.getElementById('overlay');
  const elOvMoves = document.getElementById('overlay-moves');
  const restartBtn = document.getElementById('restartBtn');

  /* ── Puzzle init ─────────────────────────────────────────── */
  function initBoard() {
    // board[i] = tile value 0..14 (0=empty), values map to ARCHIVE_WORDS
    board = Array.from({ length: TOTAL }, (_, i) => i);
    scrambleBoard();
  }

  function scrambleBoard() {
    let empty = TOTAL - 1;
    for (let i = 0; i < 500; i++) {
      const moves = getValidMoves(empty);
      const next  = moves[Math.floor(Math.random() * moves.length)];
      [board[empty], board[next]] = [board[next], board[empty]];
      empty = next;
    }
  }

  function getValidMoves(pos) {
    const row = Math.floor(pos / SIZE);
    const col = pos % SIZE;
    const moves = [];
    if (row > 0)         moves.push(pos - SIZE);
    if (row < SIZE - 1)  moves.push(pos + SIZE);
    if (col > 0)         moves.push(pos - 1);
    if (col < SIZE - 1)  moves.push(pos + 1);
    return moves;
  }

  function emptyPos() { return board.indexOf(TOTAL - 1); }

  /* ── Render ──────────────────────────────────────────────── */
  function render() {
    elGrid.innerHTML = '';
    const ep = emptyPos();

    board.forEach((val, pos) => {
      const tile = document.createElement('div');
      tile.className = 'tile';

      if (val === TOTAL - 1) {
        tile.classList.add('empty');
      } else {
        const src = currentPiece && (currentPiece.thumb || currentPiece.url);
        if (src) {
          // image fragment: tile shows the slice that belongs at its solved position
          const col = val % SIZE, row = Math.floor(val / SIZE);
          tile.classList.add('img');
          tile.style.backgroundImage = `url("${src}")`;
          tile.style.backgroundPosition =
            `${(col / (SIZE - 1)) * 100}% ${(row / (SIZE - 1)) * 100}%`;
        } else {
          tile.textContent = ARCHIVE_WORDS[val] || val + 1;
        }
        if (val === pos) tile.classList.add('correct');
        tile.addEventListener('click', () => tryMove(pos));
      }

      elGrid.appendChild(tile);
    });
  }

  function tryMove(pos) {
    if (solved) return;
    const ep     = emptyPos();
    const valid  = getValidMoves(ep);
    if (!valid.includes(pos)) return;

    [board[ep], board[pos]] = [board[pos], board[ep]];
    moveCount++;
    elMoves.textContent = moveCount;

    // flash moved tile
    const tiles = elGrid.querySelectorAll('.tile');
    tiles[ep].classList.add('moved');
    setTimeout(() => tiles[ep] && tiles[ep].classList.remove('moved'), 100);

    render();
    checkWin();
  }

  function checkWin() {
    const win = board.every((val, i) => val === i);
    if (win) {
      solved = true;
      elStatus.textContent = 'Archive restored.';
      elWin.style.opacity = '1';
      if (currentPiece) {
        const img = document.getElementById('overlay-piece');
        const src = currentPiece.url || currentPiece.thumb;
        if (src) { img.src = src; img.style.display = 'block'; }
        document.getElementById('overlay-title').textContent =
          currentPiece.title || 'Archive Restored';
        document.getElementById('overlay-cr').textContent = currentPiece.cr || '';
      }
      setTimeout(() => {
        elWin.style.opacity = '0';
        elOvMoves.textContent = `Restored in ${moveCount} moves`;
        elOverlay.classList.add('visible');
      }, 2000);
    }
  }

  function restart() {
    elOverlay.classList.remove('visible');
    document.getElementById('overlay-piece').style.display = 'none';
    solved    = false;
    winShown  = false;
    moveCount = 0;
    elMoves.textContent = 0;
    elStatus.textContent = 'Restore the archive.';
    initBoard();
    render();
    loadPiece().then(render);   // new real piece each restoration
  }

  restartBtn.addEventListener('click', restart);

  /* ── p5 background drift lines ───────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      initBoard(); render(); loadPiece().then(render);
      return;
    }

    const lines = Array.from({ length: 12 }, () => ({
      x:     Math.random(),
      y:     Math.random(),
      len:   0.04 + Math.random() * 0.08,
      vx:    (Math.random() - 0.5) * 0.0002,
      vy:    0.0001 + Math.random() * 0.0002,
      alpha: 6 + Math.random() * 10,
    }));

    const sketch = p => {
      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-host');
      };
      p.draw = () => {
        p.clear();
        lines.forEach(l => {
          l.x += l.vx; l.y += l.vy;
          if (l.y > 1.1) { l.y = -0.1; l.x = Math.random(); }
          p.stroke(201, 168, 76, l.alpha);
          p.strokeWeight(1);
          p.line(l.x * p.width, l.y * p.height,
                 (l.x + l.len) * p.width, (l.y + l.len * 0.3) * p.height);
        });
      };
      p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
    };

    new p5(sketch);
    initBoard();
    render();
    loadPiece().then(render);   // restore a real archive piece (PLGames)
  });
</script>
</body>
</html>
