<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Archive 3D — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --gold:#B8861C; --gold-bright:#D4A830; --gold-dim:#7A5C14; --gold-muted:#9A7010; }
    html, body { width:100%; height:100%; background:#F8F2E4; overflow:hidden; }
    #three-host { position:fixed; inset:0; z-index:0; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--gold-dim); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #ui { position:fixed; bottom:32px; left:50%; transform:translateX(-50%); z-index:10;
      font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-dim); white-space:nowrap; }
    #year-label { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(14px,2.5vw,20px); color:var(--gold);
      text-align:center; pointer-events:none; }
    #plhand { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(18px,3.5vw,26px); color:var(--gold);
      opacity:0; transition:opacity 0.8s; pointer-events:none; white-space:nowrap; }
  
    /* iOS touch — finger gestures drive the canvas, not the page */
    html, body { overscroll-behavior: none; touch-action: none; }
    canvas { touch-action: none; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Living Archive</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">Seven years. 1,768 pieces. Navigate the full archive in three-dimensional space. Each point is a day that held.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:var(--gold);color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="three-host"></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div id="year-label">The Living Archive — 2019 → 2025</div>
  <div id="ui">Drag to orbit · Scroll to zoom · Click a piece to view</div>
  <div id="plhand">The archive is alive.</div>
  <div id="load-status" style="position:fixed;bottom:56px;left:50%;transform:translateX(-50%);z-index:10;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-dim);white-space:nowrap;transition:opacity 0.6s;"></div>

  <!-- Piece viewer overlay -->
  <div id="piece-viewer" style="display:none;position:fixed;inset:0;background:rgba(248,242,228,0.96);z-index:200;align-items:center;justify-content:center;">
    <div style="position:relative;max-width:540px;width:90%;text-align:center;">
      <button id="viewer-close" style="position:absolute;top:-40px;right:0;background:none;border:none;font-family:'PLHand',cursive;font-size:18px;color:#7A5C14;cursor:pointer;letter-spacing:0.15em;">Close</button>
      <img id="viewer-img" src="" alt="" style="max-width:100%;max-height:70vh;object-fit:contain;border:1px solid #D4AF6A;">
      <p id="viewer-caption" style="margin-top:16px;font-family:'PLHand',cursive;font-size:16px;color:#B8861C;letter-spacing:0.1em;"></p>
    </div>
  </div>

<script>
  const host    = document.getElementById('three-host');
  const elHand  = document.getElementById('plhand');
  const elYear  = document.getElementById('year-label');
  const elLoad  = document.getElementById('load-status');
  const viewer  = document.getElementById('piece-viewer');
  const vImg    = document.getElementById('viewer-img');
  const vCap    = document.getElementById('viewer-caption');

  document.getElementById('viewer-close').onclick = () => { viewer.style.display = 'none'; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') viewer.style.display = 'none'; });

  // Dead R2 URL -> solid placeholder glyph, not a browser broken-image icon (no extra network fetch)
  const VIEWER_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">' +
    '<rect width="400" height="400" fill="#F8F2E4"/>' +
    '<text x="200" y="220" font-family="Georgia,serif" font-size="120" fill="#B8861C" text-anchor="middle">⌒</text>' +
    '</svg>'
  );

  const YEAR_META = [
    { year: 2019, min: 1,    max: 200,  label: '2019 — The Beginning',     color: 0xB8861C },
    { year: 2020, min: 201,  max: 450,  label: '2020 — Despite Everything', color: 0x9A7010 },
    { year: 2021, min: 451,  max: 730,  label: '2021 — The Practice Holds', color: 0xC49A28 },
    { year: 2022, min: 731,  max: 1030, label: '2022 — The Archive Grows',  color: 0xD4A830 },
    { year: 2023, min: 1031, max: 1350, label: '2023 — Frequency Rising',   color: 0xE0B840 },
    { year: 2024, min: 1351, max: 1630, label: '2024 — The Signal Spreads', color: 0xCA9420 },
    { year: 2025, min: 1631, max: 1768, label: '2025 — Compound',           color: 0xF0C844 },
  ];

  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0xF8F2E4, 1);
  host.appendChild(renderer.domElement);
  camera.position.set(0, 0, 420);

  const loader   = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  const yearGroups = [];
  const spriteData = []; // {sprite, num, url, year}

  // Build point cloud clusters per year (always present, even before images load)
  YEAR_META.forEach((y, yi) => {
    const group = new THREE.Group();
    const count = Math.round((y.max - y.min + 1) * 1.5);
    const positions = new Float32Array(count * 3);
    const colors    = new Float32Array(count * 3);
    const col = new THREE.Color(y.color);

    for (let i = 0; i < count; i++) {
      const r    = 18 + Math.random() * 55;
      const th   = Math.random() * Math.PI * 2;
      const ph   = Math.acos(2 * Math.random() - 1);
      positions[i*3]   = r * Math.sin(ph) * Math.cos(th);
      positions[i*3+1] = r * Math.sin(ph) * Math.sin(th) * 0.35;
      positions[i*3+2] = r * Math.cos(ph);
      const br = 0.35 + Math.random() * 0.65;
      colors[i*3] = col.r * br; colors[i*3+1] = col.g * br; colors[i*3+2] = col.b * br;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({ size: 2.6, vertexColors: true, transparent: true, opacity: 0.85 });
    group.add(new THREE.Points(geo, mat));

    const ringGeo = new THREE.RingGeometry(68, 70, 48);
    const ringMat = new THREE.MeshBasicMaterial({ color: y.color, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
    group.add(new THREE.Mesh(ringGeo, ringMat));

    const angle = (yi / YEAR_META.length) * Math.PI * 2;
    group.position.set(Math.cos(angle) * 175, 0, Math.sin(angle) * 175);
    group.userData = { year: y.year, label: y.label, angle };
    scene.add(group);
    yearGroups.push(group);
  });

  // Central ring
  const cGeo = new THREE.RingGeometry(5, 7, 6);
  const cMat = new THREE.MeshBasicMaterial({ color: 0xB8861C, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  scene.add(new THREE.Mesh(cGeo, cMat));

  // Load real images straight from the R2 catalogue manifest (existing bucket images)
  function yearFromNum(n) {
    for (const y of YEAR_META) { if (n >= y.min && n <= y.max) return y.year; }
    return 2025;
  }

  async function loadArchiveImages() {
    elLoad.textContent = 'Loading archive...';
    try {
      const resp = await fetch('https://pub-4420dc4349624d6bbed7eb9555f42661.r2.dev/manifest.json');
      if (!resp.ok) throw new Error('manifest error');
      const data = await resp.json();
      const pieces = (data && data.pieces) || [];
      if (!pieces.length) throw new Error('empty manifest');

      // Group pieces by year (year derived from piece number n)
      const byYear = {};
      YEAR_META.forEach(y => { byYear[y.year] = []; });
      pieces.forEach(p => {
        const n  = p.n || 0;
        const yr = yearFromNum(n);
        if (byYear[yr]) byYear[yr].push({ num: n, year: yr, thumb: p.thumb || p.url, full: p.url });
      });

      // Pick 8 per year, evenly spaced across each year's pool
      const SPRITES_PER_YEAR = 8;
      let loaded = 0;
      const toLoad = [];
      YEAR_META.forEach((y, yi) => {
        const pool = byYear[y.year];
        if (!pool.length) return;
        const step = Math.max(1, Math.floor(pool.length / SPRITES_PER_YEAR));
        for (let i = 0; i < SPRITES_PER_YEAR && i * step < pool.length; i++) {
          toLoad.push({ img: pool[i * step], yi });
        }
      });
      const total = toLoad.length;
      if (!total) {
        elLoad.textContent = 'Archive offline — showing structure';
        setTimeout(() => { elLoad.style.opacity = '0'; }, 3000);
        return;
      }

      toLoad.forEach(({ img, yi }) => {
        const group = yearGroups[yi];
        // thumb for the floating sprite (fast); full url opens on click
        loader.load(img.thumb, tex => {
          tex.minFilter = THREE.LinearFilter;
          if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
          const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 1 });
          const sp = new THREE.Sprite(mat);
          // Scatter within the cluster — larger so they read clearly on mobile
          const r  = 8 + Math.random() * 34;
          const th = Math.random() * Math.PI * 2;
          const ph = (Math.random() - 0.5) * 0.8;
          sp.position.set(r * Math.cos(th), r * ph * 18, r * Math.sin(th));
          sp.scale.set(26, 26, 1);
          sp.userData = { num: img.num, url: img.full, year: img.year };
          group.add(sp);
          spriteData.push({ sprite: sp, num: img.num, url: img.full, year: img.year });
          loaded++;
          elLoad.textContent = `Archive loading — ${loaded}/${total}`;
          if (loaded === total) {
            setTimeout(() => { elLoad.style.opacity = '0'; }, 2000);
          }
        }, undefined, err => { console.error('Archive thumb failed:', img.thumb, err && err.message); loaded++; });
      });
    } catch (e) {
      console.warn('Archive manifest unavailable:', e.message);
      elLoad.textContent = 'Archive offline — showing structure';
      setTimeout(() => { elLoad.style.opacity = '0'; }, 3000);
    }
  }
  loadArchiveImages();

  // Orbit controls
  let isDragging = false, lastX = 0, lastY = 0;
  let rotX = 0, rotY = 0, targetRotX = 0, targetRotY = 0;
  let handShown = false;

  renderer.domElement.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    targetRotY += (e.clientX - lastX) * 0.005;
    targetRotX += (e.clientY - lastY) * 0.003;
    lastX = e.clientX; lastY = e.clientY;
    if (!handShown) { handShown = true; elHand.style.opacity = '1'; setTimeout(() => { elHand.style.opacity = '0'; }, 3000); }
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  renderer.domElement.addEventListener('wheel', e => {
    camera.position.z = Math.max(80, Math.min(700, camera.position.z + e.deltaY * 0.3));
  }, { passive: true });

  let ltx = 0, lty = 0;
  renderer.domElement.addEventListener('touchstart', e => { ltx = e.touches[0].clientX; lty = e.touches[0].clientY; }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    targetRotY += (e.touches[0].clientX - ltx) * 0.006;
    targetRotX += (e.touches[0].clientY - lty) * 0.004;
    ltx = e.touches[0].clientX; lty = e.touches[0].clientY;
    if (!handShown) { handShown = true; elHand.style.opacity = '1'; setTimeout(() => { elHand.style.opacity = '0'; }, 3000); }
  }, { passive: true });

  // Click on sprite
  const raycaster = new THREE.Raycaster();
  raycaster.params.Sprite = { threshold: 0.5 };
  const mouse = new THREE.Vector2();
  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  });
  renderer.domElement.addEventListener('click', e => {
    if (isDragging) return;
    const m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(m, camera);
    const sprites = spriteData.map(d => d.sprite);
    const hits = raycaster.intersectObjects(sprites);
    if (hits.length > 0) {
      const sp = hits[0].object;
      const d  = spriteData.find(x => x.sprite === sp);
      if (d) {
        vImg.onerror = () => { vImg.onerror = null; vImg.src = VIEWER_PLACEHOLDER; };
        vImg.src = d.url;
        vImg.alt = `Piece ${d.num}`;
        vCap.textContent = `Piece ${d.num} · ${d.year}`;
        viewer.style.display = 'flex';
      }
    }
  });

  // Hover: show year label
  window.addEventListener('mousemove', e => {
    const m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(m, camera);
    const pts = yearGroups.map(g => g.children[0]);
    const hits = raycaster.intersectObjects(pts);
    if (hits.length > 0) {
      const gi = yearGroups.findIndex(g => g.children[0] === hits[0].object);
      elYear.textContent = gi >= 0 ? yearGroups[gi].userData.label : 'The Living Archive — 2019 → 2025';
    } else {
      elYear.textContent = 'The Living Archive — 2019 → 2025';
    }
  });

  let frame = 0;
  function animate() {
    requestAnimationFrame(animate);
    frame++;
    rotX += (targetRotX - rotX) * 0.05;
    rotY += (targetRotY - rotY) * 0.05;
    yearGroups.forEach((g, i) => { g.rotation.y = frame * 0.003 + i * 0.18; });
    scene.rotation.x = rotX;
    scene.rotation.y = rotY + frame * 0.0008;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
