<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Three Truths Room — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --gold:#B8861C; --gold-bright:#D4A830; --gold-dim:#7A5C14; --gold-muted:#9A7010; }
    html, body { width:100%; height:100%; background:#F8F2E4; overflow:hidden; }
    #three-host { position:fixed; inset:0; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--gold-dim); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #law-display { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:10; text-align:center; pointer-events:none; min-width:300px; }
    #law-num { font-size:9px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:6px; }
    #law-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(14px,2.5vw,19px); color:var(--gold); line-height:1.5; }
    #nav-btns { position:fixed; bottom:32px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:16px; }
    .nav-btn { padding:8px 20px; background:rgba(8,8,8,0.8); border:1px solid #D4AF6A; color:var(--gold-dim); font-size:9px; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; }
    .nav-btn:hover { border-color:var(--gold-dim); color:var(--gold); }
    #plhand { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(20px,4vw,32px); color:var(--gold);
      opacity:0; transition:opacity 0.8s; pointer-events:none; white-space:nowrap; text-align:center; }
  
    /* iOS touch — finger gestures drive the canvas, not the page */
    html, body { overscroll-behavior: none; touch-action: none; }
    canvas { touch-action: none; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Three Truths Room</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">Three truths. Three rooms. Walk through each in sequence. They are not concepts — they are architecture you already live inside.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:var(--gold);color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="three-host"></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div id="law-display">
    <div id="law-num">Truth I</div>
    <div id="law-text">Prepared for luxury.</div>
  </div>
  <div id="nav-btns">
    <button class="nav-btn" id="prevBtn">← Previous</button>
    <button class="nav-btn" id="nextBtn">Next →</button>
  </div>
  <div id="plhand">Watch this.</div>

<script>
  const LAWS = [
    {
      num: 'Truth I',
      text: 'Prepared for luxury.',
      sub: 'The conditions are being set long before you name the goal. Preparation is not waiting — it is building.',
      color: 0xC9A84C,
      particleColor: 0xF0D878,
    },
    {
      num: 'Truth II',
      text: 'You are in control of your reality.',
      sub: 'Not the conditions. Not the doubters. Not the default settings. You hold the variable. Act on what you know.',
      color: 0xD4B050,
      particleColor: 0xE8C860,
    },
    {
      num: 'Truth III',
      text: 'What persists in the mind becomes your reality.',
      sub: 'Seven years proves it. The mind held the Curve every day. The archive is the evidence. Persist.',
      color: 0xB09040,
      particleColor: 0xC9A84C,
    },
  ];

  const host      = document.getElementById('three-host');
  const elLawNum  = document.getElementById('law-num');
  const elLawText = document.getElementById('law-text');
  const elHand    = document.getElementById('plhand');

  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0xF8F2E4, 1);
  host.appendChild(renderer.domElement);
  camera.position.set(0, 0, 200);

  // Build 3 chambers arranged in a triangle
  const chamberGroups = [];
  const CHAMBER_POSITIONS = [
    new THREE.Vector3(0, 60, 0),
    new THREE.Vector3(-80, -40, 0),
    new THREE.Vector3(80, -40, 0),
  ];

  LAWS.forEach((law, i) => {
    const group = new THREE.Group();
    group.position.copy(CHAMBER_POSITIONS[i]);

    // Chamber frame (wireframe box)
    const boxGeo = new THREE.BoxGeometry(80, 80, 80);
    const boxMat = new THREE.MeshBasicMaterial({ color: law.color, wireframe: true, transparent: true, opacity: 0.15 });
    group.add(new THREE.Mesh(boxGeo, boxMat));

    // Inner particle cluster
    const pCount = 200;
    const pPos   = new Float32Array(pCount * 3);
    for (let j = 0; j < pCount; j++) {
      pPos[j*3]   = (Math.random()-0.5)*60;
      pPos[j*3+1] = (Math.random()-0.5)*60;
      pPos[j*3+2] = (Math.random()-0.5)*60;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: law.particleColor, size: 2.4, transparent: true, opacity: 0.92 });
    group.add(new THREE.Points(pGeo, pMat));

    // Central symbol ring
    const rGeo = new THREE.TorusGeometry(16, 1, 8, 32);
    const rMat = new THREE.MeshBasicMaterial({ color: law.color, transparent: true, opacity: 0.5 });
    group.add(new THREE.Mesh(rGeo, rMat));

    scene.add(group);
    chamberGroups.push(group);
  });

  // Connection lines between chambers
  for (let i = 0; i < 3; i++) {
    const a = CHAMBER_POSITIONS[i];
    const b = CHAMBER_POSITIONS[(i+1) % 3];
    const pts = [a, b];
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({ color: 0xC9A84C, transparent: true, opacity: 0.1 });
    scene.add(new THREE.Line(geo, mat));
  }

  // Navigation
  let currentLaw = 0;
  let targetCamX = 0, targetCamY = 0;
  let handShown  = false;

  function goToLaw(idx) {
    currentLaw = idx;
    const pos  = CHAMBER_POSITIONS[idx];
    targetCamX = pos.x;
    targetCamY = pos.y;
    elLawNum.textContent  = LAWS[idx].num;
    elLawText.textContent = LAWS[idx].text;
    if (idx === 2 && !handShown) {
      handShown = true;
      elHand.style.opacity = '1';
      setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
    }
  }

  document.getElementById('nextBtn').addEventListener('click', () => goToLaw((currentLaw + 1) % 3));
  document.getElementById('prevBtn').addEventListener('click', () => goToLaw((currentLaw + 2) % 3));

  // Keyboard navigation
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToLaw((currentLaw + 1) % 3);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goToLaw((currentLaw + 2) % 3);
  });

  let frame = 0;
  function animate() {
    requestAnimationFrame(animate);
    frame++;

    camera.position.x += (targetCamX - camera.position.x) * 0.04;
    camera.position.y += (targetCamY - camera.position.y) * 0.04;
    camera.lookAt(targetCamX, targetCamY, 0);

    chamberGroups.forEach((g, i) => {
      g.rotation.y += 0.003 * (i % 2 === 0 ? 1 : -1);
      g.rotation.x += 0.001;
      const isActive = i === currentLaw;
      g.children[0].material.opacity += (isActive ? 0.35 : 0.12 - g.children[0].material.opacity) * 0.05;
      g.children[2].material.opacity += (isActive ? 0.8 : 0.3 - g.children[2].material.opacity) * 0.05;
    });

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
