<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctuary Preview — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    :root { --gold:#B8861C; --gold-bright:#D4A830; --gold-dim:#7A5C14; --gold-muted:#9A7010; }
    html, body { width:100%; height:100%; background:#F8F2E4; overflow:hidden; cursor:crosshair; }
    #three-host { position:fixed; inset:0; }
    .nav-bar { position:fixed; top:24px; left:24px; z-index:10; }
    .nav-link { font-size:10px; letter-spacing:0.3em; color:var(--gold-dim); text-decoration:none; text-transform:uppercase; }
    .nav-link:hover { color:var(--gold); }
    #seed-whisper { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; text-align:center;
      font-family:'Cormorant Garamond',serif; font-style:italic; font-size:clamp(14px,2.5vw,20px); color:var(--gold);
      pointer-events:none; opacity:0; transition:opacity 1s; max-width:480px; padding:0 24px; line-height:1.7; }
    #hint { position:fixed; bottom:32px; left:50%; transform:translateX(-50%); z-index:10;
      font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold-dim); }
    #plhand { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); z-index:10;
      font-family:'PLHand',cursive; font-size:clamp(18px,3.5vw,26px); color:var(--gold);
      opacity:0; transition:opacity 0.8s; pointer-events:none; white-space:nowrap; }
  
    /* iOS touch — finger gestures drive the canvas, not the page */
    html, body { overscroll-behavior: none; touch-action: none; }
    canvas { touch-action: none; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Sanctuary</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">The sanctuary is the space built through practice. This is not a destination. It is what daily work looks like from the inside.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:var(--gold);color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="three-host"></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div id="seed-whisper"></div>
  <div id="hint">Move to walk · Approach seeds to read them</div>
  <div id="plhand">Watch this.</div>

<script>
  /* ── Real vault seed phrases placed in the sanctuary ─────── */
  const SANCTUARY_SEEDS = [
    "Luxury is simply permission to expand.",
    "Prepared for the version of you that already arrived.",
    "Reality bends for the prepared.",
    "What persists in the mind becomes your reality.",
    "You are in control of your reality.",
    "Become the person your dreams report to.",
    "Act like the universe already said yes.",
    "The practice is the proof. Seven years.",
    "The curve will cover the world.",
    "Precision creates miracles.",
    "Despite the conditions.",
    "Think in gold. Act in inevitability.",
  ];

  const host     = document.getElementById('three-host');
  const elSeed   = document.getElementById('seed-whisper');
  const elHand   = document.getElementById('plhand');

  const scene    = new THREE.Scene();
  scene.fog      = new THREE.Fog(0xF8F2E4, 80, 300);
  const camera   = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0xF8F2E4, 1);
  host.appendChild(renderer.domElement);
  camera.position.set(0, 8, 30);

  // Ground plane
  const groundGeo = new THREE.PlaneGeometry(400, 400, 20, 20);
  const groundMat = new THREE.MeshBasicMaterial({ color: 0x050505, wireframe: true });
  const ground    = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Seed orbs scattered in the space — real seeds first, hardcoded array is the offline fallback
  const seedMeshes = [];
  function buildSeeds(phrases) {
  phrases.forEach((phrase, i) => {
    const angle = (i / phrases.length) * Math.PI * 2;
    const r     = 30 + (i % 3) * 20;
    const x     = Math.cos(angle) * r;
    const z     = Math.sin(angle) * r;
    const y     = 4 + (i % 4) * 6;

    const geo   = new THREE.SphereGeometry(1.5, 8, 8);
    const mat   = new THREE.MeshBasicMaterial({ color: 0xC9A84C, wireframe: true, transparent: true, opacity: 0.4 });
    const mesh  = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.userData = { phrase, baseY: y };
    scene.add(mesh);
    seedMeshes.push(mesh);

    // Soft glow ring
    const ringGeo = new THREE.RingGeometry(2, 2.2, 12);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xC9A84C, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
    const ring    = new THREE.Mesh(ringGeo, ringMat);
    ring.position.set(x, 0.2, z);
    ring.rotation.x = -Math.PI / 2;
    scene.add(ring);

    mesh.userData.ring = ring;
    mesh.userData.glow = 0; // 0..1, pumped on proximity trigger, decays each frame
  });
  }

  (window.PLGames ? PLGames.seeds(SANCTUARY_SEEDS.length) : Promise.resolve([]))
    .then(function (real) {
      var phrases = (real && real.length) ? real.map(function (s) { return s.phrase; }) : SANCTUARY_SEEDS;
      buildSeeds(phrases);
    });

  // Ambient particles
  const aCount = 300;
  const aPos   = new Float32Array(aCount * 3);
  for (let i = 0; i < aCount; i++) {
    aPos[i*3]   = (Math.random()-0.5) * 200;
    aPos[i*3+1] = Math.random() * 40;
    aPos[i*3+2] = (Math.random()-0.5) * 200;
  }
  const aGeo = new THREE.BufferGeometry();
  aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
  const aMat = new THREE.PointsMaterial({ color: 0xB8861C, size: 2.2, transparent: true, opacity: 0.55 });
  scene.add(new THREE.Points(aGeo, aMat));

  // Camera movement
  const mouse = new THREE.Vector2();
  let velX    = 0, velZ = 0;
  let handShown = false;
  let lastSeedPhrase = '';

  window.addEventListener('mousemove', e => {
    mouse.x = (e.clientX / innerWidth  - 0.5) * 2;
    mouse.y = (e.clientY / innerHeight - 0.5) * 2;
  });

  renderer.domElement.addEventListener('touchmove', e => {
    mouse.x = (e.touches[0].clientX / innerWidth  - 0.5) * 2;
    mouse.y = (e.touches[0].clientY / innerHeight - 0.5) * 2;
  }, { passive: true });

  let seedTimeout = null;
  let frame = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;

    // Float seeds + decay any proximity glow
    seedMeshes.forEach((m, i) => {
      m.position.y = m.userData.baseY + Math.sin(frame * 0.015 + i) * 2;
      m.rotation.y += 0.01;
      if (m.userData.glow > 0.001) {
        m.userData.glow *= 0.94;
        m.material.opacity = 0.4 + m.userData.glow * 0.6;
        m.userData.ring.material.opacity = 0.15 + m.userData.glow * 0.55;
      }
    });

    // Move camera
    const speed = 0.15;
    camera.position.x += mouse.x * speed;
    camera.position.z += mouse.y * speed + 0.05;
    camera.position.x = Math.max(-80, Math.min(80, camera.position.x));
    camera.position.z = Math.max(-80, Math.min(80, camera.position.z));
    camera.lookAt(camera.position.x + mouse.x * 20, 8, camera.position.z - 40);

    // Check proximity to seeds
    let nearest = null, nearestDist = 18;
    seedMeshes.forEach(m => {
      const dx = camera.position.x - m.position.x;
      const dz = camera.position.z - m.position.z;
      const d  = Math.sqrt(dx*dx + dz*dz);
      if (d < nearestDist) { nearestDist = d; nearest = m; }
    });

    if (nearest && nearest.userData.phrase !== lastSeedPhrase) {
      lastSeedPhrase = nearest.userData.phrase;
      nearest.userData.glow = 1;
      elSeed.textContent = nearest.userData.phrase;
      elSeed.style.opacity = '1';
      if (seedTimeout) clearTimeout(seedTimeout);
      seedTimeout = setTimeout(() => { elSeed.style.opacity = '0'; lastSeedPhrase = ''; }, 3000);
      if (!handShown) {
        handShown = true;
        elHand.style.opacity = '1';
        setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
      }
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
