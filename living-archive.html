<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Archive — PL Beta Games</title>

  <style>
    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf?v=3') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf?v=3') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  
    /* iOS touch — finger gestures drive the canvas, not the page */
    html, body { overscroll-behavior: none; touch-action: none; }
    canvas { touch-action: none; }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F8F2E4;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* p5 canvas — full viewport, primary interaction surface */
    #p5-host {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Header overlay */
    .arc-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(248,242,228,0.88) 0%, transparent 100%);
      pointer-events: none;
    }

    .arc-header a,
    .arc-header span {
      pointer-events: auto;
    }

    .back {
      font-size: 10px;
      letter-spacing: 0.35em;
      color: #7A5C14;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
      font-family: 'PLHand', cursive;
    }
    .back:hover { color: #B8861C; }

    .title-bar {
      font-family: 'PLHand', cursive;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.2em;
      color: #0A0A0A;
      opacity: 0.7;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* PLHand back-to-browsing button */
    #backBtn {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: transparent;
      border: none;
      font-family: 'PLHand', cursive;
      font-size: clamp(22px, 4vw, 34px);
      color: #B8861C;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity 0.2s;
      padding: 8px 16px;
    }
    #backBtn:hover { opacity: 0.65; }

    :focus-visible { outline: 2px solid #7A5C14; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      /* Drift disabled in sketch — interactions still work */
    }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>

<div id="game-instructions" style="position:fixed;inset:0;z-index:1000;background:#F8F2E4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;">
  <p style="font-family:'PLHand',cursive;font-size:9px;letter-spacing:0.5em;text-transform:uppercase;color:#7A5C14;margin-bottom:16px;">How to Play</p>
  <h2 style="font-family:'PLHand',cursive;font-size:clamp(28px,6vw,52px);color:#0A0A0A;font-weight:400;margin-bottom:20px;">Living Archive</h2>
  <p style="font-family:'PLHand',cursive;font-size:clamp(14px,2vw,18px);color:#3A3020;max-width:480px;line-height:1.7;margin-bottom:32px;">Seven years of the practice arranged as circles. Hover to preview pieces from that year. Click a year to enter it and explore the archive. Each piece is proof the practice held.</p>
  <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:12px;letter-spacing:0.4em;text-transform:uppercase;padding:16px 40px;background:transparent;border:1px solid #7A5C14;color:#B8861C;cursor:pointer;">Begin</button>
</div>

<div id="p5-host"></div>

<header class="arc-header">
  <a class="back" href="index.html">← Games</a>
  <span class="title-bar">The Living Archive</span>
  <span></span>
</header>

<button id="backBtn">Watch this.</button>

<script>
  // ── Archive data ───────────────────────────────────────────────────────────
  const ARCHIVE_YEARS = [
    {
      year: 2018, pieces: 180, color: 'rgba(184,134,28,0.15)',
      recent: ['Practice 001', 'The First Field', 'Void Study I'],
      archive: [
        'Practice 001', 'The First Field', 'Void Study I',
        'Mark in Gold', 'The Beginning', 'Signal I',
        'Before Language', 'Study in Dark', 'The Practice Opens', 'First Return'
      ]
    },
    {
      year: 2019, pieces: 240, color: 'rgba(184,134,28,0.18)',
      recent: ['Curve Study III', 'The Gate', 'Gold on Void'],
      archive: [
        'Curve Study III', 'The Gate', 'Gold on Void',
        'Preparation', 'Trace', 'The Arc Returns',
        'Study in Motion', 'Hold', 'The Path', 'Pattern I'
      ]
    },
    {
      year: 2020, pieces: 310, color: 'rgba(184,134,28,0.22)',
      recent: ['Isolation Mark', 'The Practice Holds', 'Control I'],
      archive: [
        'Isolation Mark', 'The Practice Holds', 'Control I',
        'The Void Speaks', 'Daily Return', 'The Axis',
        'Persistence I', 'What Remains', 'The Signal', 'Archive I'
      ]
    },
    {
      year: 2021, pieces: 280, color: 'rgba(184,134,28,0.20)',
      recent: ['The Loop', 'Signal Study', 'What Persists'],
      archive: [
        'The Loop', 'Signal Study', 'What Persists',
        'Congregation I', 'The Practice Is', 'Gold Field',
        'The Transmission', 'Curve VI', 'Known', 'The Archive Grows'
      ]
    },
    {
      year: 2022, pieces: 320, color: 'rgba(184,134,28,0.24)',
      recent: ['Reality Command', 'The Vault Opens', 'Doctrine I'],
      archive: [
        'Reality Command', 'The Vault Opens', 'Doctrine I',
        'Sovereign Mark', 'Gold Transmission', 'The Wave',
        'Persistence III', 'Archive III', 'The Proof', 'Compound'
      ]
    },
    {
      year: 2023, pieces: 290, color: 'rgba(184,134,28,0.22)',
      recent: ['Seven Years', 'First Principle', 'Signal Rising'],
      archive: [
        'Seven Years', 'First Principle', 'Signal Rising',
        'The Congregation', 'Gold on Bone', 'What Was Planted',
        'The Return', 'Truth I Applied', 'Proof of Practice', 'The Practice Expands'
      ]
    },
    {
      year: 2024, pieces: 148, color: 'rgba(184,134,28,0.18)',
      recent: ['Prepared for Luxury', 'Wearable I', 'The Mark Sells'],
      archive: [
        'Prepared for Luxury', 'Wearable I', 'The Mark Sells',
        'The New Transmission', 'Doctrine Applied', 'Archive Released',
        'Gold Standard', 'The Practice Pays', 'What Was Built', 'The Store Opens'
      ]
    },
  ];

  // ── Shared state for back button communication ─────────────────────────────
  let requestExit = false;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('backBtn').addEventListener('click', () => {
    requestExit = true;
  });

  // ── p5 sketch ─────────────────────────────────────────────────────────────
  const archiveSketch = p => {
    let state = 'browsing'; // browsing | entering | entered | exiting
    let selectedIdx = -1;
    let hoveredIdx  = -1;
    let hoveredPieceIdx = -1;
    let t = 0; // transition value 0→1 (entering) or 1→0 (exiting)
    let circles = [];
    let pieceCircles = [];

    p.setup = () => {
      const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
      cnv.parent('p5-host');
      p.noStroke();
      initCircles();
      loadRealPieces();   // overlay real archive pieces onto the year circles
    };

    // ── Real archive pieces (PLGames) distributed across the year circles ──
    let realPieces = null;
    function distributeReal() {
      if (!realPieces || !realPieces.length || !circles.length) return;
      const per = Math.max(1, Math.floor(realPieces.length / circles.length));
      circles.forEach((c, i) => {
        const slice = realPieces.slice(i * per, (i + 1) * per).slice(0, 10);
        if (!slice.length) return;
        c.archive = slice.map(pp => ({ title: pp.title || pp.cr, cr: pp.cr }));
        c.recent  = c.archive.slice(0, 3).map(pp => pp.title);
      });
    }
    function loadRealPieces() {
      if (!window.PLGames) return;
      if (realPieces) { distributeReal(); return; }
      PLGames.loadArchive().then(pieces => {
        realPieces = (pieces || []).filter(pp => pp && pp.cr);
        distributeReal();
      });
    }

    function initCircles() {
      const W = p.width, H = p.height;
      const positions = [
        [0.22, 0.32], [0.52, 0.20], [0.80, 0.34],
        [0.16, 0.68], [0.50, 0.76], [0.76, 0.63], [0.88, 0.42]
      ];
      circles = ARCHIVE_YEARS.map((y, i) => ({
        ...y,
        r: p.map(y.pieces, 100, 400, 40, 86),
        baseX: positions[i][0] * W,
        baseY: positions[i][1] * H,
        x: positions[i][0] * W,
        y: positions[i][1] * H,
        edgeX: 0, edgeY: 0,
      }));
    }

    function buildPieceCircles() {
      const sel = circles[selectedIdx];
      const bigR = Math.min(p.width, p.height) * 0.28;
      const cx = p.width / 2;
      const cy = p.height / 2;
      const count = Math.min(sel.archive.length, 10);

      pieceCircles = sel.archive.slice(0, count).map((item, j) => {
        const angle = (j / count) * Math.PI * 2 - Math.PI / 2;
        const r2    = bigR * (0.40 + (j % 2) * 0.15);
        const isObj = item && typeof item === 'object';
        return {
          x: cx + Math.cos(angle) * r2,
          y: cy + Math.sin(angle) * r2,
          r: 11 + (j % 3) * 4,
          title: isObj ? item.title : item,
          cr:    isObj ? item.cr : null,
        };
      });
    }

    p.draw = () => {
      p.background(248, 242, 228);

      // Poll exit request from HTML back button
      if (requestExit && state === 'entered') {
        state = 'exiting';
        t = 1;
        requestExit = false;
        document.getElementById('backBtn').style.display = 'none';
        hoveredPieceIdx = -1;
      }

      // Advance transition
      if (state === 'entering') {
        t = Math.min(t + 0.055, 1);
        if (t >= 1) {
          state = 'entered';
          buildPieceCircles();
          document.getElementById('backBtn').style.display = '';
        }
      } else if (state === 'exiting') {
        t = Math.max(t - 0.055, 0);
        if (t <= 0) {
          state = 'browsing';
          selectedIdx = -1;
          pieceCircles = [];
          hoveredIdx = -1;
        }
      }

      const inTransition = (state === 'entering' || state === 'exiting');
      const progress = (state === 'entered') ? 1 : (state === 'browsing') ? 0 : t;
      const bigR = Math.min(p.width, p.height) * 0.28;

      // Draw all year circles
      circles.forEach((c, i) => {
        // Drift only in browsing state
        if (state === 'browsing' && !prefersReduced) {
          c.x = c.baseX + Math.sin(p.frameCount * 0.008 + i * 2.1) * 2.5;
          c.y = c.baseY + Math.sin(p.frameCount * 0.010 + i * 1.4) * 5;
        }

        const isSel = (i === selectedIdx);
        const isHov = (i === hoveredIdx) && state === 'browsing';

        let cx, cy, cr, alpha;

        if (isSel && selectedIdx >= 0) {
          // Selected: lerp to center, grow
          cx = p.lerp(c.x, p.width / 2,   progress);
          cy = p.lerp(c.y, p.height / 2,  progress);
          cr = p.lerp(c.r, bigR,           progress);
          alpha = 1;
        } else if (!isSel && selectedIdx >= 0) {
          // Non-selected: lerp to edge, shrink, dim
          cx = p.lerp(c.x, c.edgeX, progress);
          cy = p.lerp(c.y, c.edgeY, progress);
          cr = p.lerp(c.r, c.r * 0.44, progress);
          alpha = p.lerp(1, 0.25, progress);
        } else {
          cx = c.x; cy = c.y; cr = c.r; alpha = 1;
        }

        const fillA   = Math.round(alpha * (isHov ? 78 : 44));
        const strokeA = Math.round(alpha * (isHov ? 200 : isSel ? 200 : 75));
        const strokeW = (isHov || isSel) ? 1.5 : 0.7;

        p.noStroke();
        p.fill(184, 134, 28, fillA);
        p.circle(cx, cy, cr * 2);

        p.stroke(184, 134, 28, strokeA);
        p.strokeWeight(strokeW);
        p.noFill();
        p.circle(cx, cy, cr * 2);
        p.noStroke();

        // Text
        const tSize  = Math.max(11, Math.round(cr * 0.28));
        const tAlpha = alpha * (state === 'entered' && !isSel ? 0 : 1);
        if (tAlpha > 0.05) {
          dt(String(c.year), cx, cy - 5, { size: tSize, opacity: tAlpha * 0.9, family: 'PLHand' });
          if (cr > 42 && tAlpha > 0.1) {
            dt(`${c.pieces} pieces`, cx, cy + tSize * 0.9, { size: 9, opacity: tAlpha * 0.35, family: 'PLHand' });
          }
        }

        // Hover tooltip: 3 recent pieces
        if (isHov) {
          c.recent.forEach((title, j) => {
            dt(title, cx, cy + cr + 18 + j * 14, { size: 10, opacity: 0.5, family: 'PLHand' });
          });
        }
      });

      // Piece circles — only in entered state
      if (state === 'entered') {
        pieceCircles.forEach((pc, j) => {
          const isHov = (j === hoveredPieceIdx);
          p.noStroke();
          p.fill(184, 134, 28, isHov ? 110 : 52);
          p.circle(pc.x, pc.y, isHov ? pc.r * 2.6 : pc.r * 2);

          if (isHov) {
            dt(pc.title, pc.x, pc.y + pc.r + 10, { size: 11, opacity: 0.72, family: 'PLHand' });
          }
        });
      }
    };

    // Shared drawText helper using drawingContext
    function dt(str, x, y, {size = 13, opacity = 1, family = 'Inter', weight = '300', align = 'center', base = 'middle'} = {}) {
      const ctx = p.drawingContext;
      ctx.save();
      ctx.font      = `${weight} ${size}px '${family}', Georgia, sans-serif`;
      ctx.fillStyle = `rgba(10,10,10,${opacity})`;
      ctx.textAlign     = align;
      ctx.textBaseline  = base;
      ctx.fillText(str, x, y);
      ctx.restore();
    }

    p.mouseMoved = () => {
      if (state === 'browsing') {
        hoveredIdx = -1;
        circles.forEach((c, i) => {
          if (p.dist(p.mouseX, p.mouseY, c.x, c.y) <= c.r + 6) hoveredIdx = i;
        });
        document.getElementById('p5-host').style.cursor = hoveredIdx >= 0 ? 'pointer' : 'default';
      } else if (state === 'entered') {
        hoveredPieceIdx = -1;
        pieceCircles.forEach((pc, j) => {
          if (p.dist(p.mouseX, p.mouseY, pc.x, pc.y) <= pc.r + 8) hoveredPieceIdx = j;
        });
        document.getElementById('p5-host').style.cursor = hoveredPieceIdx >= 0 ? 'pointer' : 'default';
      }
    };

    p.mousePressed = () => {
      // Recompute what is under the pointer at press time — touch has no hover,
      // so without this the first tap on mobile would do nothing.
      if (state === 'browsing') {
        hoveredIdx = -1;
        circles.forEach((c, i) => { if (p.dist(p.mouseX, p.mouseY, c.x, c.y) <= c.r + 6) hoveredIdx = i; });
      } else if (state === 'entered') {
        hoveredPieceIdx = -1;
        pieceCircles.forEach((pc, j) => { if (p.dist(p.mouseX, p.mouseY, pc.x, pc.y) <= pc.r + 8) hoveredPieceIdx = j; });
      }

      if (state === 'browsing' && hoveredIdx >= 0) {
        const idx = hoveredIdx;
        selectedIdx = idx;

        // Assign edge positions for non-selected circles
        const edgeSlots = [
          [0.07, 0.10], [0.93, 0.08], [0.06, 0.90], [0.94, 0.88],
          [0.50, 0.05], [0.08, 0.50], [0.92, 0.50]
        ];
        let slot = 0;
        circles.forEach((c, i) => {
          if (i !== idx) {
            c.edgeX = edgeSlots[slot][0] * p.width;
            c.edgeY = edgeSlots[slot][1] * p.height;
            slot++;
          }
        });

        state = 'entering';
        t = 0;
        hoveredIdx = -1;

      } else if (state === 'entered' && hoveredPieceIdx >= 0) {
        const pc = pieceCircles[hoveredPieceIdx];
        const dest = (pc && pc.cr)
          ? 'https://beta.psychedluxuries.com/catalogue/' + encodeURIComponent(pc.cr)
          : 'https://beta.psychedluxuries.com/catalogue';
        window.open(dest, '_blank');
      }
    };

    // Touch: drive the same press logic and prevent default page scroll/zoom
    p.touchStarted = () => { p.mousePressed(); return false; };

    p.windowResized = () => {
      p.resizeCanvas(p.windowWidth, p.windowHeight);
      state = 'browsing';
      selectedIdx = -1;
      hoveredIdx = -1;
      hoveredPieceIdx = -1;
      t = 0;
      pieceCircles = [];
      document.getElementById('backBtn').style.display = 'none';
      requestExit = false;
      initCircles();
      loadRealPieces();   // re-apply real pieces after circles rebuild
    };
  };

  if (typeof p5 !== 'undefined') {
    new p5(archiveSketch);
  }

  (function() {
    const panel = document.getElementById('game-instructions');
    if (!panel) return;
    if (sessionStorage.getItem('pl_instructions_seen_' + location.pathname)) { panel.style.display = 'none'; return; }
    document.getElementById('begin-btn').addEventListener('click', function() {
      panel.style.display = 'none';
      sessionStorage.setItem('pl_instructions_seen_' + location.pathname, '1');
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { panel.style.display = 'none'; sessionStorage.setItem('pl_instructions_seen_' + location.pathname, '1'); }
    });
  })();
</script>
