<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Watch This Moment — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 100%; height: 100%;
      background: #F0EAF8;
      overflow: hidden;
      cursor: none;
    }

    #canvas-host {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #canvas-host canvas { display: block; }

    .nav-bar {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
    }
    .nav-link {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: rgba(85,85,85,0.6);
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }
    .nav-link:hover { color: rgba(201,168,76,0.8); cursor: pointer; }

    #plhand-reveal {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'PLHand', cursive;
      font-size: clamp(22px, 4vw, 32px);
      color: #6B3FA8;
      opacity: 0;
      transition: opacity 1.5s;
      pointer-events: none;
      white-space: nowrap;
    }
    /* The reveal — a real piece surfaces from the archive when the Curve completes */
    #piece-reveal {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; background: rgba(8,8,8,0.92);
      opacity: 0; pointer-events: none; transition: opacity 1.2s;
    }
    #piece-reveal.show { opacity: 1; pointer-events: auto; }
    #piece-reveal img { max-width: min(80vw, 520px); max-height: 62vh; object-fit: contain;
      border: 1px solid rgba(201,168,76,0.4); box-shadow: 0 12px 60px rgba(0,0,0,0.6); }
    #piece-reveal .pr-cr { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 0.35em;
      text-transform: uppercase; color: rgba(201,168,76,0.85); }
    #piece-reveal .pr-title { font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(18px, 3vw, 26px); color: #f1ece1; }
    #piece-reveal .pr-again { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 0.3em;
      text-transform: uppercase; color: rgba(201,168,76,0.7); cursor: pointer; border: 1px solid rgba(201,168,76,0.3);
      padding: 8px 20px; margin-top: 8px; background: none; }
    #piece-reveal .pr-again:hover { color: #c9a84c; border-color: #c9a84c; }
  
    /* iOS touch — finger gestures drive the canvas, not the page */
    html, body { overscroll-behavior: none; touch-action: none; }
    canvas { touch-action: none; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F0EAF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#6B3FA8;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">Watch This Moment</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A1880;line-height:1.7;margin-bottom:36px;">This moment is the entire practice. Do not explain it. Do not move past it. Watch it. That is all that is required.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#6B3FA8;color:#F0EAF8;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>

  <div id="canvas-host"></div>

  <nav class="nav-bar">
    <a class="nav-link" href="index.html">← Games</a>
  </nav>

  <div id="plhand-reveal">Watch this.</div>

  <div id="piece-reveal">
    <span class="pr-cr" id="prCr"></span>
    <img id="prImg" alt="A piece from the archive" />
    <span class="pr-title" id="prTitle"></span>
    <button class="pr-again" id="prAgain">Draw another Curve</button>
  </div>

<script>
  const elHand = document.getElementById('plhand-reveal');

  // The Curve completes → a real piece surfaces from the archive (PLGames spine).
  const elReveal = document.getElementById('piece-reveal');
  async function revealPiece() {
    try {
      const piece = (window.PLGames && await window.PLGames.randomPiece()) || null;
      if (!piece) return;
      document.getElementById('prImg').src = piece.url || piece.thumb || piece.image;
      document.getElementById('prCr').textContent = piece.cr || '';
      document.getElementById('prTitle').textContent = (piece.title && piece.title !== piece.cr) ? piece.title : 'From the archive';
      elReveal.classList.add('show');
    } catch (e) { /* the archive is quiet — leave the canvas */ }
  }
  document.getElementById('prAgain').addEventListener('click', () => elReveal.classList.remove('show'));

  const sketch = p => {
    const W = () => p.windowWidth;
    const H = () => p.windowHeight;

    const GOLD = [201, 168, 76];
    const VOID = [8, 8, 8];

    let curves       = [];   // completed bezier curve paths
    let currentPath  = null; // path being drawn
    let allPoints    = [];   // all points ever drawn
    let tracing      = false;
    let totalDist    = 0;
    let handShown    = false;
    let fadeIn       = 0;    // 0..1 intro fade
    let introMsg     = true;

    p.setup = () => {
      const cnv = p.createCanvas(W(), H());
      cnv.parent('canvas-host');
    };

    p.draw = () => {
      p.background(...VOID, 12); // trail

      // intro fade
      if (introMsg) {
        fadeIn = Math.min(1, fadeIn + 0.008);
        p.fill(201, 168, 76, 30 * fadeIn);
        p.noStroke();
        p.textAlign(p.CENTER, p.CENTER);
        p.textSize(10);
        p.text('Draw the Curve.', W() / 2, H() / 2);
        if (fadeIn >= 1 && p.frameCount > 160) introMsg = false;
      }

      // draw all saved curves
      curves.forEach(curve => {
        if (curve.pts.length < 2) return;
        p.noFill();
        p.stroke(...GOLD, 40);
        p.strokeWeight(1);
        p.beginShape();
        curve.pts.forEach(pt => p.curveVertex(pt.x, pt.y));
        p.endShape();
      });

      // draw current path
      if (currentPath && currentPath.pts.length > 1) {
        p.noFill();
        p.stroke(...GOLD, 180);
        p.strokeWeight(2);
        p.beginShape();
        currentPath.pts.forEach(pt => p.curveVertex(pt.x, pt.y));
        p.endShape();
      }

      // custom cursor
      const mx = p.mouseX, my = p.mouseY;
      p.stroke(...GOLD, 80);
      p.strokeWeight(1);
      p.noFill();
      p.ellipse(mx, my, 12, 12);
      p.fill(...GOLD, 150);
      p.noStroke();
      p.ellipse(mx, my, 3, 3);

      // distance meter (very faint)
      if (totalDist > 100) {
        p.fill(...GOLD, 20);
        p.noStroke();
        p.textSize(8);
        p.textAlign(p.RIGHT, p.TOP);
        p.text(`${Math.floor(totalDist)} units`, W() - 24, H() - 24);
      }
    };

    p.mousePressed = () => {
      if (introMsg) introMsg = false;
      tracing = true;
      currentPath = { pts: [{ x: p.mouseX, y: p.mouseY }] };
    };

    p.mouseDragged = () => {
      if (!tracing || !currentPath) return;
      const last = currentPath.pts[currentPath.pts.length - 1];
      const dx = p.mouseX - last.x;
      const dy = p.mouseY - last.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d > 4) {
        currentPath.pts.push({ x: p.mouseX, y: p.mouseY });
        totalDist += d;
        allPoints.push({ x: p.mouseX, y: p.mouseY });

        // show "Watch this." after drawing a meaningful curve
        if (totalDist > 800 && !handShown) {
          handShown = true;
          elHand.style.opacity = '1';
          setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
          setTimeout(revealPiece, 2600);
        }
      }
    };

    p.mouseReleased = () => {
      if (!tracing || !currentPath) return;
      tracing = false;
      if (currentPath.pts.length > 3) curves.push(currentPath);
      currentPath = null;
    };

    p.touchStarted = () => {
      if (introMsg) introMsg = false;
      tracing = true;
      currentPath = { pts: [{ x: p.mouseX, y: p.mouseY }] };
      return false;
    };

    p.touchMoved = () => {
      if (!tracing || !currentPath) return false;
      const last = currentPath.pts[currentPath.pts.length - 1];
      const dx = p.mouseX - last.x;
      const dy = p.mouseY - last.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d > 4) {
        currentPath.pts.push({ x: p.mouseX, y: p.mouseY });
        totalDist += d;
        if (totalDist > 800 && !handShown) {
          handShown = true;
          elHand.style.opacity = '1';
          setTimeout(() => { elHand.style.opacity = '0'; }, 3000);
          setTimeout(revealPiece, 2600);
        }
      }
      return false;
    };

    p.touchEnded = () => {
      if (!tracing || !currentPath) return false;
      tracing = false;
      if (currentPath.pts.length > 3) curves.push(currentPath);
      currentPath = null;
      return false;
    };

    p.windowResized = () => p.resizeCanvas(W(), H());
  };

  document.addEventListener('DOMContentLoaded', () => {
    new p5(sketch);
  });
</script>
</body>
</html>
