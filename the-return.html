<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Return — PL Beta Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'PLHand';
      src: url('fonts/MaurriceMccannPsychedHandwrit-Regular.otf?v=3') format('opentype'),
           url('fonts/MaurriceMccannPsychedHandwrit-Regular.ttf?v=3') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --void: #F8F2E4;
      --gold: #B8861C;
      --gold-bright: #D4A830;
      --gold-dim: #7A5C14;
      --gold-muted: #9A7020;
      --bone: #0A0A0A;
      --ash: #3A3020;
      --border: #D4AF6A;
      --btn-bg: #EDE5CE;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--void);
      color: var(--bone);
      font-family: 'PLHand', cursive;
      overflow: hidden;
      user-select: none;
    }

    /* ── P5 pulse layer ────────────────────────────────────── */
    #p5-host {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #p5-host canvas { display: block; width: 100% !important; height: 100% !important; }

    /* ── UI layer ──────────────────────────────────────────── */
    .page {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── Nav ───────────────────────────────────────────────── */
    .nav-bar {
      position: fixed;
      top: 24px; left: 24px;
      z-index: 10;
    }
    .nav-link {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--ash);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-link:hover { color: var(--gold); }

    /* ── Score strip ────────────────────────────────────────── */
    #score-strip {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 32px;
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .score-item { color: var(--gold-dim); }
    .score-item strong { color: var(--gold); font-weight: 300; }

    /* ── Status message ─────────────────────────────────────── */
    #status-msg {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ash);
      text-align: center;
      margin-bottom: 56px;
      height: 16px;
      transition: opacity 0.3s;
    }

    /* ── Glyph ring ─────────────────────────────────────────── */
    .glyph-ring {
      position: relative;
      width: 320px;
      height: 320px;
    }

    @media (max-width: 400px) {
      .glyph-ring { width: 260px; height: 260px; }
    }

    .glyph-btn {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      transform: translate(-50%, -50%);
    }

    .glyph-btn:hover { border-color: var(--gold-dim); }
    .glyph-btn:focus-visible { outline: 2px solid var(--gold-dim); outline-offset: 2px; }

    .glyph-btn.lit {
      background: rgba(201, 168, 76, 0.18);
      border-color: var(--gold);
    }

    .glyph-btn.error {
      background: rgba(160, 60, 60, 0.2);
      border-color: rgba(200, 80, 80, 0.6);
    }

    .glyph-symbol {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px;
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 2px;
    }

    .glyph-name {
      font-size: 8px;
      letter-spacing: 0.2em;
      color: var(--gold-dim);
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .glyph-btn:hover .glyph-name { opacity: 1; }

    /* ── PLHand overlays ─────────────────────────────────────── */
    #plhand-return {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'PLHand', cursive;
      font-size: clamp(18px, 3.5vw, 26px);
      color: var(--gold);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      white-space: nowrap;
    }

    #plhand-watch {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-family: 'PLHand', cursive;
      font-size: clamp(18px, 3.5vw, 26px);
      color: var(--gold);
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      white-space: nowrap;
    }

    /* real piece that "returns" at each milestone */
    #return-piece {
      position: fixed; bottom: 118px; left: 50%; transform: translateX(-50%);
      z-index: 11; width: min(150px, 40vw); text-align: center;
      opacity: 0; transition: opacity .6s; pointer-events: none;
    }
    #return-piece.show { opacity: 1; }
    #return-piece img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--gold-dim); display: block; }
    #return-piece .c { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--gold); margin-top: 5px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
      #p5-host { display: none; }
    }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F8F2E4;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#B8861C;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Return</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A3020;line-height:1.7;margin-bottom:36px;">Everything in the practice returns. Navigate the cycle. What leaves will come back stronger than it left.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#B8861C;color:#F8F2E4;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>

  <div id="p5-host"></div>

  <nav class="nav-bar">
    <a class="nav-link" href="index.html">← Games</a>
  </nav>

  <div id="score-strip">
    <span class="score-item">Current: <strong id="currentLen">0</strong></span>
    <span class="score-item">Best: <strong id="bestLen">0</strong></span>
  </div>

  <div class="page">
    <div id="status-msg">Watching the sequence.</div>
    <div class="glyph-ring" id="glyphRing"></div>
  </div>

  <div id="plhand-return">The practice is return.</div>
  <div id="plhand-watch">Watch this.</div>
  <div id="return-piece"><img alt=""><div class="c"></div></div>

<script>
  /* ── Lexicon ─────────────────────────────────────────────── */
  const LEXICON = [
    { id: 'curve',        symbol: '⌒', glyph: 'Curve' },
    { id: 'preparation',  symbol: '◈', glyph: 'Preparation' },
    { id: 'control',      symbol: '⊕', glyph: 'Control' },
    { id: 'persistence',  symbol: '∞', glyph: 'Persistence' },
    { id: 'signal',       symbol: '◉', glyph: 'Signal' },
    { id: 'archive',      symbol: '▣', glyph: 'Archive' },
    { id: 'congregation', symbol: '⬡', glyph: 'Congregation' }
  ];

  /* ── State ───────────────────────────────────────────────── */
  let sequence      = [];
  let playerSeq     = [];
  let isShowing     = false;
  let playerTurn    = false;
  let bestLength    = 0;
  let firstMiss     = true;
  let watchShown    = false;
  let pulses        = [];   // p5 pulse emissions

  /* ── DOM ─────────────────────────────────────────────────── */
  const elStatus  = document.getElementById('status-msg');
  const elCurrent = document.getElementById('currentLen');
  const elBest    = document.getElementById('bestLen');
  const elReturn  = document.getElementById('plhand-return');
  const elWatch   = document.getElementById('plhand-watch');
  const elReturnPiece = document.getElementById('return-piece');
  const ring      = document.getElementById('glyphRing');

  /* ── Real archive piece "returns" at milestones (PLGames) ── */
  function revealReturnPiece() {
    if (!window.PLGames) return;
    PLGames.randomPiece().then(p => {
      if (!p) return;
      elReturnPiece.querySelector('img').src = p.thumb || p.url || '';
      elReturnPiece.querySelector('.c').textContent = p.title || p.cr || '';
      elReturnPiece.classList.add('show');
      setTimeout(() => elReturnPiece.classList.remove('show'), 2600);
    });
  }
  /* ── Best length persists across sessions (PLGames state) ── */
  function saveBest() { if (window.PLGames) PLGames.save('the-return', { best: bestLength }); }

  /* ── Build glyph buttons in circle ──────────────────────── */
  const N   = LEXICON.length; // 7
  const R   = ring.clientWidth / 2 || 160;
  const btns = [];

  LEXICON.forEach((g, i) => {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const bx    = 50 + Math.cos(angle) * 44;  // % of ring size
    const by    = 50 + Math.sin(angle) * 44;

    const btn = document.createElement('button');
    btn.className   = 'glyph-btn';
    btn.style.left  = bx + '%';
    btn.style.top   = by + '%';
    btn.dataset.id  = g.id;
    btn.dataset.idx = i;
    btn.innerHTML   = `<span class="glyph-symbol">${g.symbol}</span><span class="glyph-name">${g.glyph}</span>`;
    btn.setAttribute('aria-label', g.glyph);
    btn.addEventListener('click', () => onGlyphClick(i));
    ring.appendChild(btn);
    btns.push(btn);
  });

  /* ── Glyph light ─────────────────────────────────────────── */
  function lightBtn(idx, duration = 600, isError = false) {
    const btn = btns[idx];
    if (!btn) return;
    btn.classList.add(isError ? 'error' : 'lit');
    emitPulse(idx);
    setTimeout(() => {
      btn.classList.remove('lit', 'error');
    }, duration);
  }

  /* ── p5 pulse emission ───────────────────────────────────── */
  function emitPulse(btnIdx) {
    const btn  = btns[btnIdx];
    const rect = btn.getBoundingClientRect();
    const cx   = rect.left + rect.width / 2;
    const cy   = rect.top  + rect.height / 2;
    pulses.push({ x: cx, y: cy, r: 0, alpha: 80 });
  }

  /* ── Game logic ──────────────────────────────────────────── */
  function startRound() {
    const nextIdx = Math.floor(Math.random() * N);
    sequence.push(nextIdx);
    playerSeq  = [];
    playerTurn = false;
    elStatus.textContent = 'Watch.';
    elCurrent.textContent = sequence.length;
    playSequence();
  }

  function playSequence() {
    isShowing  = true;
    let i      = 0;
    const step = () => {
      if (i >= sequence.length) {
        isShowing  = false;
        playerTurn = true;
        elStatus.textContent = 'Your turn.';
        return;
      }
      lightBtn(sequence[i], 500);
      i++;
      setTimeout(step, 800);
    };
    setTimeout(step, 400);
  }

  function onGlyphClick(idx) {
    if (!playerTurn || isShowing) return;

    lightBtn(idx, 300);
    playerSeq.push(idx);

    const pos     = playerSeq.length - 1;
    const correct = sequence[pos];

    if (idx !== correct) {
      // Wrong — reset
      lightBtn(idx, 600, true);
      playerTurn = false;

      if (firstMiss) {
        firstMiss = false;
        elReturn.style.opacity = '1';
        setTimeout(() => { elReturn.style.opacity = '0'; }, 3000);
      }

      if (sequence.length > bestLength) {
        bestLength = sequence.length;
        elBest.textContent = bestLength;
        saveBest();
      }

      elStatus.textContent = 'Begin again.';
      sequence  = [];
      playerSeq = [];
      setTimeout(() => startRound(), 2000);
      return;
    }

    // Correct so far
    if (playerSeq.length === sequence.length) {
      // Completed this sequence
      playerTurn = false;
      elStatus.textContent = '';

      if (sequence.length > bestLength) {
        bestLength = sequence.length;
        elBest.textContent = bestLength;
        saveBest();
      }

      // every fifth return brings a real piece back from the archive
      if (sequence.length % 5 === 0) revealReturnPiece();

      if (sequence.length >= 10 && !watchShown) {
        watchShown = true;
        elWatch.style.opacity = '1';
        setTimeout(() => { elWatch.style.opacity = '0'; }, 2500);
      }

      setTimeout(() => startRound(), 800);
    }
  }

  /* ── p5 sketch ───────────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', () => {
    // restore the player's best return length (PLGames state)
    if (window.PLGames) {
      PLGames.load('the-return').then(d => {
        if (d && d.best && d.best > bestLength) { bestLength = d.best; elBest.textContent = bestLength; }
      });
    }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      startRound();
      return;
    }

    const sketch = p => {
      p.setup = () => {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-host');
      };

      p.draw = () => {
        p.clear();
        for (let i = pulses.length - 1; i >= 0; i--) {
          const pl = pulses[i];
          pl.r     += 4;
          pl.alpha -= 4;
          if (pl.alpha <= 0) { pulses.splice(i, 1); continue; }
          p.noFill();
          p.stroke(201, 168, 76, pl.alpha);
          p.strokeWeight(1);
          p.ellipse(pl.x, pl.y, pl.r * 2);
        }
      };

      p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
    };

    new p5(sketch);
    startRound();
  });
</script>
</body>
</html>
