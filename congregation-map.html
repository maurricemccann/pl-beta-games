  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @font-face {
      font-family: 'PLHand';

    html, body { width: 100%; height: 100%; background: #F0EAF8; overflow: hidden; }
    #canvas-host { position: fixed; inset: 0; z-index: 0; }
    #canvas-host canvas { display: block; }

    #plhand { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 10;

    #join-btn:hover { border-color: #6B3FA8; }
  </style>
  <!-- PL theme injection: reads accent/glyph from URL params or sessionStorage -->
  <script id="pl-theme">
  (function(){
    function hexToRgb(h){h=h.replace(/^#/,'');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
    function clamp(v){return Math.max(0,Math.min(255,Math.round(v)));}
    function rgbToHex(r,g,b){return'#'+[r,g,b].map(function(x){return clamp(x).toString(16).padStart(2,'0')}).join('');}
    function lighten(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]+(255-c[0])*pct,c[1]+(255-c[1])*pct,c[2]+(255-c[2])*pct);}
    function darken(h,pct){var c=hexToRgb(h);return rgbToHex(c[0]*(1-pct),c[1]*(1-pct),c[2]*(1-pct));}
    function isHex(s){return /^#?[0-9a-fA-F]{6}$/.test(s);}
    function applyAccent(accent){
      var h=accent.startsWith('#')?accent:'#'+accent;
      var el=document.documentElement;
      el.style.setProperty('--gold',h);
      el.style.setProperty('--gold-bright',lighten(h,0.18));
      el.style.setProperty('--gold-light',lighten(h,0.14));
      el.style.setProperty('--gold-dim',darken(h,0.25));
      el.style.setProperty('--gold-muted',darken(h,0.12));
    }
    var params=new URLSearchParams(window.location.search);
    var accent=params.get('accent')||'';
    var glyph=params.get('glyph')||'';
    if(accent&&isHex(accent)){
      sessionStorage.setItem('pl_accent',accent);
      applyAccent(accent);
    } else {
      var sa=sessionStorage.getItem('pl_accent');
      if(sa&&isHex(sa)){applyAccent(sa);}
    }
    if(glyph){sessionStorage.setItem('pl_glyph',glyph);}
    window.PL_GLYPH=glyph||sessionStorage.getItem('pl_glyph')||'';
    function propagateLinks(){
      var a=sessionStorage.getItem('pl_accent');
      var g=sessionStorage.getItem('pl_glyph');
      if(!a&&!g)return;
      var links=document.querySelectorAll('a[href]');
      links.forEach(function(el){
        var href=el.getAttribute('href');
        if(!href||href.startsWith('http')||href.startsWith('//')||href.startsWith('#'))return;
        if(!href.endsWith('.html'))return;
        if(el.dataset.plThemed)return;
        el.dataset.plThemed='1';
        var url=new URL(href,window.location.href);
        if(a)url.searchParams.set('accent',a);
        if(g)url.searchParams.set('glyph',g);
        el.setAttribute('href',url.pathname.split('/').pop()+'?'+url.searchParams.toString());
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',propagateLinks);}else{propagateLinks();}
  })();
  </script><script src="pl-game-data.js"></script>
<script src="pl-points.js" defer></script></head>
<body>
<div id="game-instructions" style="position:fixed;inset:0;background:#F0EAF8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'PLHand',cursive;">
  <div style="max-width:500px;text-align:center;">
    <p style="font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#6B3FA8;margin-bottom:16px;">How to Play</p>
    <h2 style="font-size:clamp(26px,4vw,40px);color:#0A0A0A;margin-bottom:20px;line-height:1.2;font-weight:400;">The Congregation Map</h2>
    <p style="font-size:clamp(16px,2.5vw,20px);color:#3A1880;line-height:1.7;margin-bottom:36px;">The congregation is not a metaphor. Place yourself on the map. The field is real and it is growing around you.</p>
    <button id="begin-btn" style="font-family:'PLHand',cursive;font-size:20px;background:#6B3FA8;color:#F0EAF8;border:none;padding:14px 40px;cursor:pointer;letter-spacing:0.1em;">Begin</button>
  </div>
</div>
<script>
(function(){
  var panel=document.getElementById('game-instructions');
  if(!panel)return;
  if(sessionStorage.getItem('pl_seen_'+location.pathname)){panel.style.display='none';return;}
  document.getElementById('begin-btn').addEventListener('click',function(){
    panel.style.display='none';
    sessionStorage.setItem('pl_seen_'+location.pathname,'1');
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){panel.style.display='none';sessionStorage.setItem('pl_seen_'+location.pathname,'1');}
  });
})();
</script>
  <div id="canvas-host"></div>
  <nav class="nav-bar"><a class="nav-link" href="index.html">← Games</a></nav>
  <div id="join-ui">
    <input id="join-input" placeholder="Your name or signal" maxlength="20">
    <button id="join-btn">Join</button>
  </div>
  <div id="plhand">The congregation forms.</div>

<script>
  /* ── Seed congregation from vault seed phrases ─────────────── */
  const SEED_NAMES = [
    'Curve','Archive','Signal','Persistence','Control','Preparation','Congregation',
    'Frequency','Alignment','Practice','Reality','Gold','Void','Pattern','Glyph',
    'Lineage','Totem','Dissolution','Sovereignty','Expansion',
  ];

  const DOCTRINE_FRAGMENTS = [
    'Prepared for luxury.','In control of reality.','What persists becomes real.',
    'Produce despite conditions.','The practice is the proof.',
    'Seven years. No days off.','The curve covers the world.',
    'Luxury is permission to expand.','Attract at the speed of alignment.',
    'The archive is evidence.','Reality bends for the prepared.',
  ];

  const elHand   = document.getElementById('plhand');
  const elInput  = document.getElementById('join-input');
  const elJoin   = document.getElementById('join-btn');

  // load/save congregation from localStorage
  const KEY = 'pl_congregation';
  const GAME = 'congregation_map';
  let archiveCount = 0;
  function loadCongregation() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function saveCongregation(c) {
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch {}
    if (window.PLGames) {                           // persist only the member's own mark, across devices
      const mine = c.filter(m => m.mine).slice(-20);
      if (mine.length) PLGames.save(GAME, mine);
    }
  }

  let congregation = loadCongregation();   // seeded from the live corpus in hydrate()

  let hoveredIdx  = -1;
  let pulses      = [];
  let handShown   = false;

  function joinCongregation() {
    const name = elInput.value.trim();
    if (!name) return;
    const entry = {
      name,
      angle:    Math.random() * Math.PI * 2,
      r:        0.15 + Math.random() * 0.35,
      fragment: DOCTRINE_FRAGMENTS[Math.floor(Math.random() * DOCTRINE_FRAGMENTS.length)],
      t:        Date.now(),
      mine:     true,
    };
    congregation.push(entry);
    saveCongregation(congregation);
    elInput.value = '';
    pulses.push({ t: Date.now() });
    if (!handShown) { handShown = true; elHand.style.opacity = '1'; setTimeout(() => { elHand.style.opacity = '0'; }, 3000); }
  }

  elJoin.addEventListener('click', joinCongregation);
  elInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinCongregation(); });

  hydrate();

  /* ── ground the constellation in the live brand corpus + restore the member's own mark ── */
  async function hydrate() {
    if (window.PLGames) {
      try {
        const [seedRows, pieces] = await Promise.all([PLGames.seeds(SEED_NAMES.length), PLGames.loadArchive()]);
        archiveCount = (pieces || []).length;
        if (congregation.length === 0) {
          const real = (seedRows || []).map(s => s && s.phrase ? String(s.phrase).trim() : '').filter(Boolean);
          const frags = real.length ? real : DOCTRINE_FRAGMENTS;
          congregation = SEED_NAMES.map((name, i) => ({
            name, angle: (i / SEED_NAMES.length) * Math.PI * 2,
            r: 0.2 + Math.random() * 0.3, fragment: frags[i % frags.length], t: Date.now() - i * 60000,
          }));
          saveCongregation(congregation);
        }
      } catch (_) {}
    }
    // fallback seed when the spine is unreachable
    if (congregation.length === 0) {
      congregation = SEED_NAMES.map((name, i) => ({
        name, angle: (i / SEED_NAMES.length) * Math.PI * 2,
        r: 0.2 + Math.random() * 0.3, fragment: DOCTRINE_FRAGMENTS[i % DOCTRINE_FRAGMENTS.length], t: Date.now() - i * 60000,
      }));
      saveCongregation(congregation);
    }
    // restore the member's own joins from D1 (cross-device presence)
    if (window.PLGames && PLGames.signedIn()) {
      try {
        const mine = await PLGames.load(GAME);
        if (Array.isArray(mine) && mine.length) {
          const seen = new Set(congregation.map(m => m.t));
          mine.forEach(m => { if (m && !seen.has(m.t)) { congregation.push({ ...m, mine: true }); seen.add(m.t); } });
          saveCongregation(congregation);
        }
      } catch (_) {}
    }
  }

  const sketch = p => {
    const W = () => p.windowWidth, H = () => p.windowHeight;
    let particles = [];

    p.setup = () => { const cnv = p.createCanvas(W(), H()); cnv.parent('canvas-host'); };

    p.draw = () => {
      p.background(240, 234, 248, 20);
      const cx = W() / 2, cy = H() / 2;
      const maxR = Math.min(W(), H()) * 0.44;

      // pulses
      while (pulses.length > 0) {
        pulses.pop();
        for (let i = 0; i < 20; i++) {
          const a = p.random(p.TWO_PI);
          particles.push({ x: cx, y: cy, vx: Math.cos(a) * p.random(2,5), vy: Math.sin(a) * p.random(2,5), alpha: 140 });
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 4;
        if (pt.alpha <= 0) { particles.splice(i, 1); continue; }
        p.fill(201, 168, 76, pt.alpha); p.noStroke(); p.ellipse(pt.x, pt.y, 3);
      }

      // center glyph
      p.fill(201, 168, 76, 60); p.noStroke();
      p.textAlign(p.CENTER, p.CENTER); p.textSize(28); p.text('⬡', cx, cy);
      p.fill(201, 168, 76, 20); p.noFill(); p.stroke(201, 168, 76, 15); p.strokeWeight(1);
      p.ellipse(cx, cy, maxR * 2);
      p.ellipse(cx, cy, maxR * 1.3);

      // constellation members
      congregation.forEach((member, i) => {
        const t    = p.frameCount * 0.002 + member.angle;
        const dist = member.r * maxR;
        const x    = cx + Math.cos(t) * dist;
        const y    = cy + Math.sin(t) * dist * 0.6;
        const hover = p.dist(p.mouseX, p.mouseY, x, y) < 20;

        // connection line to center
        p.stroke(201, 168, 76, hover ? 40 : 12);
        p.strokeWeight(0.5);
        p.line(cx, cy, x, y);

        // dot
        p.fill(201, 168, 76, hover ? 200 : 80);
        p.noStroke();
        p.ellipse(x, y, hover ? 8 : 5);

        // name label
        p.fill(201, 168, 76, hover ? 200 : 60);
        p.textSize(9);
        p.textAlign(p.CENTER, p.CENTER);
        p.text(member.name, x, y - 14);

        // doctrine on hover
        if (hover) {
          p.fill(240, 234, 214, 160);
          p.textSize(9);
          p.textAlign(p.CENTER, p.CENTER);
          const words = member.fragment.split(' ');
          const line1 = words.slice(0, Math.ceil(words.length / 2)).join(' ');
          const line2 = words.slice(Math.ceil(words.length / 2)).join(' ');
          p.text(line1, x, y + 24);
          if (line2) p.text(line2, x, y + 36);
          hoveredIdx = i;
        }
      });

      // count
      p.fill(201, 168, 76, 40); p.textSize(9); p.textAlign(p.CENTER, p.TOP);
      p.text(`${congregation.length} in the congregation`, cx, 24);
      if (archiveCount) p.text(`${archiveCount.toLocaleString()} pieces in the archive`, cx, 38);
    };

    p.windowResized = () => p.resizeCanvas(W(), H());
  };

  document.addEventListener('DOMContentLoaded', () => { new p5(sketch); });
</script>
